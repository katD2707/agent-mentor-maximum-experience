[project]
name = "mentor-workspace"
version = "0.1.0"
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6"]

[tool.uv.workspace]
members = [
  "packages/mentor-schemas",
  "sandbox-image/harness",
  "sandbox-image/scripts",
  "services/gateway",
  "services/course-builder",
  "evals",
]

[tool.uv.sources]
mentor-schemas = { workspace = true }
mentor-scripts = { workspace = true }
mentor-harness = { workspace = true }
mentor-course-builder = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls a real external service; skipped unless its MENTOR_LIVE_* env var is 1"]

[tool.ruff]
line-length = 120
