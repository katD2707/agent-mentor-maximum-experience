[project]
name = "mentor-workspace"
version = "0.1.0"
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6"]

[tool.uv.workspace]
members = [
  "packages/mentor-schemas",
  "sandbox-image/harness",
  "sandbox-image/scripts",
  "services/gateway",
  "services/parent-channel",
  "services/email-ingest",
  "evals",
]

[tool.uv.sources]
mentor-schemas = { workspace = true }
mentor-scripts = { workspace = true }
mentor-harness = { workspace = true }
mentor-parent-channel = { workspace = true }
mentor-email-ingest = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
