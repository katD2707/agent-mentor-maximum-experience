[project]
name = "mentor-scripts"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mentor-schemas",
    "pypdf>=6.21.3",
    "pypdfium2==5.14.0",  # pdf_render: page images of scanned PDFs (bundled PDFium, no system libraries)
    "pyyaml>=6.0.3",
    "sympy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mentor_scripts"]
