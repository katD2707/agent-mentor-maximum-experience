[package]
name = "mentor-desktop"
version = "0.1.0"
description = "Mentor desktop pop-up: floating bubble + compact chat panel"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-single-instance = "=2.5.5"
# Windows toasts for nudges (notify-rust / tauri-winrt-notification underneath); 2.8 shows toast
# buttons on Windows and reports clicks to Rust (`on_action`).
tauri-plugin-notification = "=2.8.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Linux only: the GTK bindings Tauri already uses (same version as in Cargo.lock), for the XWayland
# backend choice and the focus check of the panel's file chooser (see main.rs, `linux_display` and
# `foreground_is_ours`).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
