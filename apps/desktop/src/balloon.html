<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Mentor: nhắc nhở</title>
    <link rel="stylesheet" href="balloon.css" />
  </head>
  <!-- The speech balloon beside the bubble. The shell fills it (mentorBalloon.render), places the
       window from the height reported back (balloon_ready), then reveals it. -->
  <body data-side="right" data-state="idle">
    <div id="live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <section
      id="balloon"
      class="balloon"
      role="dialog"
      aria-modal="false"
      aria-labelledby="title"
      aria-describedby="text"
    >
      <div id="card" class="card">
        <button id="content" class="content" type="button" aria-describedby="open-hint">
          <span id="title" class="title"></span>
          <span id="text" class="text"></span>
        </button>
        <span id="open-hint" hidden>Mở trong khung chat</span>
        <div id="actions" class="actions" role="group" aria-label="Trả lời nhanh"></div>
        <button id="close" class="close" type="button" aria-label="Đóng nhắc nhở" title="Đóng (Esc)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" /></svg>
        </button>
      </div>
      <span class="tail" aria-hidden="true"></span>
    </section>
    <script src="balloon.js"></script>
  </body>
</html>
