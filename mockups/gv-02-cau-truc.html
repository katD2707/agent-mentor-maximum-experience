<!doctype html>
<html lang="vi" data-age="thpt" data-state="xem" data-course="vat-li">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cấu trúc khóa học</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap&subset=vietnamese">
<link rel="stylesheet" href="shared.css">
<script src="shared.js"></script>
<link rel="stylesheet" href="ga-guide.css"><script src="ga-guide.js" defer></script>
<style>
  /* same on gv-01..03: header with step indicator */
  .steps { display: flex; gap: 4px; align-items: center; margin-left: 6px; }
  .steps a { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px 0 6px; border-radius: 99px; color: var(--ink-2); text-decoration: none; font-size: .88em; font-weight: 500; }
  .steps a:hover { background: var(--tim-soft); }
  .steps .n { width: 22px; height: 22px; border-radius: 99px; border: 1.5px solid var(--rule-strong); display: grid; place-items: center; font-size: .8em; font-weight: 600; }
  .steps a[aria-current] { color: var(--tim-ink); background: var(--tim-soft); font-weight: 600; }
  .steps a[aria-current] .n { background: var(--tim); color: var(--on-tim); border-color: transparent; }
  .topbar .btn.act { min-height: 44px; padding: 0 18px; white-space: nowrap; flex: none; }
  .topbar .btn.act[aria-disabled="true"] { opacity: .5; cursor: default; }
  @media (max-width: 640px) { .steps .l { display: none; } .steps a { padding: 0 4px; } .topbar > a.icon-btn { display: none; } .topbar .logo .nm { display: none; } .topbar .btn.act { padding: 0 14px; } }

  /* the outline is the page: chapters fold open to lessons, one line each */
  .main { max-width: 760px; padding-bottom: 60px; display: grid; gap: 18px; align-content: start; }
  .course-head h1 { font-size: clamp(1.4em, 3.2vw, 1.8em); }
  .course-head .meta { color: var(--ink-2); font-size: .88em; margin-top: 4px; font-variant-numeric: tabular-nums; }

  .bads { display: grid; gap: 8px; }
  .bad { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 52px; padding: 6px 8px 6px 12px; border-radius: 12px; background: var(--do-soft); }
  .bad > svg { width: 20px; height: 20px; color: var(--do); }
  .bad .reason { color: var(--ink-2); font-size: .88em; }
  .bad .btn { min-height: 40px; padding: 0 14px; font-size: .9em; background: var(--surface); border: 1.5px solid var(--do); color: var(--do); }

  .outline { border-radius: 14px; padding: 8px 14px 14px 64px; border: 1px solid var(--rule-strong); display: grid; gap: 4px; }
  details.tg { display: grid; }
  details.tg > summary { list-style: none; display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 6px; align-items: center; min-height: 48px; cursor: pointer; border-radius: 8px; }
  details.tg > summary::-webkit-details-marker { display: none; }
  details.tg > summary:hover .chv { background: var(--tim-soft); color: var(--tim-ink); }
  details.tg > summary:focus-visible { outline: 2px solid var(--tim); }
  .chv { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-3); }
  .chv svg { width: 16px; height: 16px; transition: transform .15s; }
  details.tg:not([open]) > summary .chv svg { transform: rotate(-90deg); }
  .tname { font-weight: 600; font-size: 1.02em; }
  .tcnt { color: var(--ink-3); font-size: .85em; font-variant-numeric: tabular-nums; }
  .tbody { padding-left: 12px; display: grid; gap: 2px; padding-bottom: 6px; }
  .grp { display: grid; gap: 2px; }
  .ghead { display: grid; grid-template-columns: 32px minmax(0, 1fr) 40px; gap: 6px; align-items: center; min-height: 44px; }
  .fold, .add, .del { width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-3); cursor: pointer; display: grid; place-items: center; padding: 0; }
  .fold:hover, .add:hover { background: var(--tim-soft); color: var(--tim-ink); }
  .fold svg { width: 16px; height: 16px; transition: transform .15s; }
  .grp[data-fold="1"] .fold svg { transform: rotate(-90deg); }
  .grp[data-fold="1"] .lessons, .grp[data-fold="1"] .add { display: none; }
  .add svg, .del svg { width: 18px; height: 18px; }
  .del:hover { color: var(--do); background: var(--do-soft); }
  .ctitle { font-weight: 600; }
  [contenteditable="true"] { outline: none; padding: 4px 6px; border-radius: 6px; }
  [contenteditable="true"]:hover { background: var(--vang-soft); }
  [contenteditable="true"]:focus { background: var(--vang-soft); box-shadow: inset 0 -2px 0 var(--tim); }
  .lessons { list-style: none; margin: 0; padding: 0 0 6px 30px; display: grid; gap: 2px; min-height: 8px; }
  .lesson, .ext { display: grid; grid-template-columns: 28px 24px minmax(0, 1fr) auto 36px; gap: 8px; align-items: center; min-height: 44px; padding: 0 4px 0 2px; border-radius: 10px; }
  .lesson:hover { background: var(--tim-soft); }
  .lesson.dragging { opacity: .4; }
  .lesson.drop-before { outline: 2px dashed var(--tim); outline-offset: 2px; }
  .handle { width: 28px; height: 32px; border: 0; background: transparent; cursor: grab; color: var(--ink-3); display: grid; place-items: center; border-radius: 6px; }
  .handle:hover { color: var(--ink); }
  .no { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-size: .75em; font-weight: 600; color: var(--ink-2); border: 1px solid var(--rule-strong); }
  .fmt { display: inline-flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 8px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-size: .86em; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .fmt:hover { background: var(--surface); color: var(--tim-ink); }
  .fmt .kinds { display: inline-flex; gap: 5px; color: var(--ink-3); }
  .fmt .kinds svg { width: 16px; height: 16px; }
  .warn { width: 8px; height: 8px; border-radius: 99px; background: var(--vang); box-shadow: 0 0 0 2px var(--surface); flex: none; }
  .st { display: none; color: var(--ink-3); }
  .st svg { width: 18px; height: 18px; }
  .ext { color: var(--ink-2); font-size: .88em; grid-template-columns: 28px 24px minmax(0, 1fr); }
  .ext svg { width: 18px; height: 18px; color: var(--ink-3); justify-self: center; }
  .row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; min-height: 44px; padding: 0 4px 0 30px; }
  .row .nm { font-weight: 500; }
  .row .ct { color: var(--ink-2); font-size: .88em; font-variant-numeric: tabular-nums; }
  .row > svg { width: 18px; height: 18px; color: var(--ink-3); justify-self: center; }
  .bil { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 99px; border: 1.5px solid var(--rule-strong); background: transparent; color: var(--ink-2); font: inherit; font-size: .88em; cursor: pointer; }
  .bil:hover { border-color: var(--tim); color: var(--tim-ink); }
  .bil b { color: var(--ink); font-weight: 600; }
  .bil svg { width: 16px; height: 16px; }
  @media (max-width: 560px) {
    .outline { padding-left: 10px; padding-right: 10px; background-image: none; }
    .tbody { padding-left: 0; }
    .lesson { grid-template-columns: 28px 24px minmax(0, 1fr) 36px; row-gap: 0; padding-bottom: 4px; }
    .lesson .fmt { grid-column: 3; grid-row: 2; justify-self: start; min-height: 32px; padding-left: 6px; }
    .lesson .st, .lesson .del { grid-column: 4; grid-row: 1; }
    .lessons { padding-left: 0; }
    .row { padding-left: 4px; }
  }

  /* composing: rows lock and show progress on the right */
  :root[data-state="dang-soan"] .handle, :root[data-state="dang-soan"] .del, :root[data-state="dang-soan"] .add, :root[data-state="dang-soan"] .ph { display: none; }
  :root[data-state="dang-soan"] .lesson { grid-template-columns: 24px minmax(0, 1fr) auto 28px; }
  :root[data-state="dang-soan"] .ext { grid-template-columns: 24px minmax(0, 1fr); }
  :root[data-state="dang-soan"] .st { display: inline-flex; }
  :root[data-state="dang-soan"] .fmt { pointer-events: none; }
  @media (max-width: 560px) { :root[data-state="dang-soan"] .lesson { grid-template-columns: 24px minmax(0, 1fr) 28px; } :root[data-state="dang-soan"] .lesson .fmt { grid-column: 2; } :root[data-state="dang-soan"] .lesson .st { grid-column: 3; } }
  .st.done { color: var(--xanh); }
  .st.now { color: var(--tim-ink); }
  :root[data-state="dang-soan"] .lesson.s-now .title { font-weight: 600; }
 :root[data-state="dang-soan"] .lesson.s-wait .title, :root[data-state="dang-soan"] .lesson.s-wait .no, :root[data-state="dang-soan"] .lesson.s-wait .fmt { color: var(--ink-3); }

  .composer .box { display: flex; align-items: center; gap: 10px; padding: 4px 4px 4px 16px; border-radius: 999px; background: var(--surface); border: 1.5px solid var(--rule-strong); }
  .composer .box:focus-within { border-color: var(--tim); }
  .composer input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; min-height: 40px; font: inherit; color: var(--ink); }
  .composer .send { width: 40px; height: 40px; border-radius: 999px; border: 0; background: var(--tim); color: var(--on-tim); display: grid; place-items: center; cursor: pointer; flex: none; }
</style>
</head>

<script>
(function () {
  const icon = (n) => window.mentorIcon(n);
  const en = () => document.documentElement.lang === "en";
  const L = (vi, e) => (en() ? e : vi);
  const svg = (d) => '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + "</svg>";
  // step kinds: g explain, c pick a picture, d fill, n match, x order, k drag on diagram, r recall
  const KIND = {
    g: ["Giảng", "Explain", icon("text")],
    c: ["Chọn hình", "Pick a picture", icon("image")],
    d: ["Điền", "Fill in", icon("edit")],
    n: ["Nối", "Match", svg('<circle cx="5" cy="7" r="2"/><circle cx="19" cy="17" r="2"/><path d="M7 7h4a3 3 0 0 1 3 3v4a3 3 0 0 0 3 3"/>')],
    x: ["Xếp", "Order", svg('<path d="M4 7h10M4 12h14M4 17h8"/><path d="m18 5 2 2-2 2"/>')],
    k: ["Kéo sơ đồ", "Drag on diagram", icon("target")],
    r: ["Nhớ lại", "Recall", icon("refresh")]
  };
  const HEADPH = svg('<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>');
  const COURSES = {
    "vat-li": {
      h1: ["Vật lí 11: Điện trường", "Physics 11: Electric field"],
      ch: [
        ["Chương 1. Lực điện", [["Điện tích, định luật Cu-lông", 12, 6, "gcdr", 0]]],
        ["Chương 2. Điện trường", [["Cường độ điện trường", 11, 6, "gcdkr", 1], ["Đường sức điện", 9, 5, "gckr", 0], ["Điện trường đều", 10, 5, "gdxr", 0]]],
        ["Chương 3. Điện thế và tụ điện", [["Thế năng điện", 12, 7, "gcdnr", 0], ["Điện thế, hiệu điện thế", 10, 5, "gdxr", 1], ["Tụ điện", 13, 7, "gcdnkr", 0]]]
      ],
      lv: [24, 20, 16, 10]
    },
    en: {
      h1: ["Tiếng Anh 11: Global Success", "English 11: Global Success"],
      ch: [
        ["Unit 1. Family life", [["Vocabulary: family", 10, 5, "gcnr", 0], ["Present simple and continuous", 12, 6, "gdxr", 1]]],
        ["Unit 2. School", [["Reading: a day at school", 11, 6, "gcdr", 0], ["Listening: school clubs", 9, 5, "gcnr", 0]]]
      ],
      lv: [30, 24, 18, 12]
    }
  };
  const LEVELS = [["Nhận biết", "Recall"], ["Thông hiểu", "Understand"], ["Vận dụng", "Apply"], ["Vận dụng cao", "Advanced"]];
  const TESTS = [["Cuối chương 1", "End of chapter 1", 20, 30], ["Thi thử", "Mock exam", 40, 50]];
  const outline = document.getElementById("outline");
  const chapters = document.getElementById("chapters");
  let course = "vat-li", bil = 30;
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function renderAll() {
    const C = COURSES[course];
    document.getElementById("hh").textContent = L(C.h1[0], C.h1[1]);
    chapters.innerHTML = C.ch.map((c) =>
      '<section class="grp"><div class="ghead"><button type="button" class="fold" aria-expanded="true"><i data-i="chev"></i></button><span class="ctitle" contenteditable="true" spellcheck="false">' + esc(c[0]) + '</span><button type="button" class="add"><i data-i="plus"></i></button></div>' +
      '<ol class="lessons">' + c[1].map((l) => '<li class="lesson" data-steps="' + l[1] + '" data-min="' + l[2] + '" data-kinds="' + l[3] + '" data-warn="' + l[4] + '"><span>' + esc(l[0]) + "</span></li>").join("") +
      '<li class="ext"><span class="ph"></span>' + HEADPH + '<span data-l="Nghe tóm tắt · 4 phút|Listen to summary · 4 min"></span></li></ol></section>').join("");
    document.getElementById("levels").innerHTML = LEVELS.map((v, i) =>
      '<div class="row"><span class="no">' + (i + 1) + '</span><span class="nm" data-l="' + v[0] + "|" + v[1] + '"></span><span class="ct" data-n="' + C.lv[i] + '"></span><span class="st"></span></div>').join("");
    document.getElementById("tests").innerHTML = TESTS.map((t) =>
      '<div class="row">' + icon("quiz") + '<span class="nm" data-l="' + t[0] + "|" + t[1] + '"></span><span class="ct" data-q="' + t[2] + '" data-m="' + t[3] + '"></span><span class="st"></span></div>').join("");
    chapters.querySelectorAll(".lesson").forEach(build);
    chapters.querySelectorAll(".lessons").forEach(wireList);
    chapters.querySelectorAll(".grp").forEach(wireGrp);
    if (window.mockPaint) window.mockPaint(outline);
    renumber();
  }

  function build(li) {
    const title = li.querySelector("span").textContent;
    const kinds = li.dataset.kinds.split("");
    li.innerHTML =
      '<button type="button" class="handle" aria-label="Kéo để đổi thứ tự (hoặc dùng phím mũi tên)"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></button>' +
      '<span class="no"></span>' +
      '<span class="title" contenteditable="true" spellcheck="false"></span>' +
      '<a class="fmt" href="gv-03-duyet-noi-dung.html?state=duyet"><span class="meta"></span><span class="kinds">' + kinds.map((k) => '<span data-k="' + k + '">' + KIND[k][2] + "</span>").join("") + '</span>' + (li.dataset.warn === "1" ? '<span class="warn"></span>' : "") + "</a>" +
      '<span class="st"></span>' +
      '<button type="button" class="del">' + icon("trash") + "</button>";
    li.querySelector(".title").textContent = title;
    wire(li);
  }

  const doneN = 2; // mock: first two lessons finished while composing
  function renumber() {
    const all = [...outline.querySelectorAll(".lesson")];
    if (all.some((li) => !li.querySelector(".no"))) return; // not built yet
    const busy = document.documentElement.dataset.state === "dang-soan";
    document.getElementById("hh").textContent = L(COURSES[course].h1[0], COURSES[course].h1[1]);
    all.forEach((li, i) => {
      li.querySelector(".no").textContent = i + 1;
      li.querySelector(".del").setAttribute("aria-label", L("Xóa bài ", "Delete lesson ") + (i + 1));
      const st = li.querySelector(".st");
      const k = i < doneN ? "done" : i === doneN ? "now" : "wait";
      li.classList.remove("s-done", "s-now", "s-wait"); li.classList.add("s-" + k);
      st.className = "st " + k;
      st.innerHTML = icon(k === "done" ? "check" : k === "now" ? "refresh" : "clock");
      st.title = k === "done" ? L("Xong", "Done") : k === "now" ? L("Đang dựng", "Making") : L("Chờ", "Waiting");
      const n = +li.dataset.steps, m = +li.dataset.min;
      const f = li.querySelector(".fmt");
      f.querySelector(".meta").textContent = busy && k === "wait" ? L("Chờ", "Waiting") : busy && k === "now" ? Math.ceil(n * 0.6) + "/" + n + L(" bước", " steps") : n + L(" bước · ", " steps · ") + m + L(" phút", " min");
      f.title = L("Xem bài này", "Review this lesson");
      f.querySelectorAll(".kinds > span").forEach((s) => { const kn = KIND[s.dataset.k]; s.title = en() ? kn[1] : kn[0]; });
      const w = f.querySelector(".warn"); if (w) w.title = L("Mentor chưa chắc ở 1 bước", "Mentor is unsure about 1 step");
      f.querySelector(".kinds").style.display = busy && k !== "done" ? "none" : "";
    });
    outline.querySelectorAll("[data-l]").forEach((e) => { const p = e.dataset.l.split("|"); e.textContent = L(p[0], p[1]); });
    outline.querySelectorAll(".ct").forEach((e) => { e.textContent = e.dataset.n ? e.dataset.n + L(" câu", " questions") : e.dataset.q + L(" câu · ", " questions · ") + e.dataset.m + L(" phút", " min"); });
    outline.querySelectorAll(".row .st").forEach((e) => { e.innerHTML = icon("clock"); e.title = L("Chờ", "Waiting"); });
    const ch = outline.querySelectorAll(".grp").length;
    document.getElementById("cnt").textContent = en() ? ch + " chapters · " + all.length + " lessons" : ch + " chương · " + all.length + " bài";
    document.getElementById("lcnt").textContent = String(all.length);
    document.getElementById("prog").textContent = Math.min(doneN, all.length) + "/" + all.length + L(" xong · có thể đóng app", " done · you can close the app");
    document.getElementById("biltx").innerHTML = L("Song ngữ: bắt đầu <b>" + bil + "%</b> tiếng Việt", "Bilingual: start at <b>" + bil + "%</b> Vietnamese");
    outline.querySelectorAll(".ctitle").forEach((c) => c.setAttribute("aria-label", L("Tên chương", "Chapter name")));
    outline.querySelectorAll(".fold").forEach((f) => f.setAttribute("aria-label", L("Gập hoặc mở chương", "Fold chapter")));
    outline.querySelectorAll(".add").forEach((a) => a.setAttribute("aria-label", L("Thêm bài", "Add lesson")));
  }

  let dragged = null;
  function clearMarks() { outline.querySelectorAll(".drop-before").forEach((x) => x.classList.remove("drop-before")); }
  function wire(li) {
    const handle = li.querySelector(".handle");
    // drag only from the handle so text inside stays selectable/editable
    handle.addEventListener("pointerdown", () => { li.draggable = true; });
    handle.addEventListener("pointerup", () => { li.draggable = false; });
    li.addEventListener("dragstart", (e) => { dragged = li; li.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", ""); });
    li.addEventListener("dragend", () => { li.draggable = false; li.classList.remove("dragging"); dragged = null; clearMarks(); renumber(); });
    li.addEventListener("dragover", (e) => {
      if (!dragged || dragged === li) return;
      e.preventDefault(); clearMarks(); li.classList.add("drop-before");
    });
    li.addEventListener("drop", (e) => { e.preventDefault(); if (dragged && dragged !== li) li.before(dragged); });
    // keyboard reorder on the handle
    handle.addEventListener("keydown", (e) => {
      const all = [...outline.querySelectorAll(".lesson")];
      const i = all.indexOf(li);
      if (e.key === "ArrowUp" && i > 0) { all[i - 1].before(li); }
      else if (e.key === "ArrowDown" && i < all.length - 1) { all[i + 1].after(li); }
      else return;
      e.preventDefault(); handle.focus(); renumber();
    });
    li.querySelector(".del").addEventListener("click", () => { li.remove(); renumber(); });
    li.querySelector(".title").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); e.target.blur(); } });
  }
  // dropping on the empty end of a chapter appends to that chapter (before its listen row)
  function wireList(ol) {
    ol.addEventListener("dragover", (e) => { if (dragged) e.preventDefault(); });
    ol.addEventListener("drop", (e) => { if (dragged && (e.target === ol || e.target.closest(".ext"))) ol.insertBefore(dragged, ol.querySelector(".ext")); });
  }
  function wireGrp(g) {
    const ol = g.querySelector(".lessons");
    g.querySelector(".fold").addEventListener("click", (e) => {
      const f = g.dataset.fold !== "1";
      g.dataset.fold = f ? "1" : "0";
      e.currentTarget.setAttribute("aria-expanded", String(!f));
    });
    g.querySelector(".ctitle").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); e.target.blur(); } });
    g.querySelector(".add").addEventListener("click", () => {
      g.dataset.fold = "0"; g.querySelector(".fold").setAttribute("aria-expanded", "true");
      const li = document.createElement("li");
      li.className = "lesson"; li.dataset.steps = "0"; li.dataset.min = "0"; li.dataset.kinds = "g"; li.dataset.warn = "0";
      li.innerHTML = "<span>" + L("Bài mới", "New lesson") + "</span>";
      ol.insertBefore(li, ol.querySelector(".ext"));
      build(li); renumber();
      const t = li.querySelector(".title");
      t.focus(); document.getSelection().selectAllChildren(t);
    });
  }

  document.getElementById("bil").addEventListener("click", () => { bil = bil === 30 ? 50 : bil === 50 ? 10 : 30; renumber(); });

  // lock editing while composing
  function lock() {
    const busy = document.documentElement.dataset.state === "dang-soan";
    outline.querySelectorAll("[contenteditable]").forEach((el) => el.setAttribute("contenteditable", busy ? "false" : "true"));
    document.getElementById("go").setAttribute("aria-disabled", String(busy));
  }
  document.addEventListener("DOMContentLoaded", () => {
    course = document.documentElement.dataset.course === "en" ? "en" : "vat-li";
    renderAll(); lock();
  });
  document.addEventListener("mock:change", () => {
    const c = document.documentElement.dataset.course === "en" ? "en" : "vat-li";
    if (c !== course) { course = c; renderAll(); } else renumber();
    lock();
  });

  // typed instruction: Mentor applies it, no follow-up questions
  const toast = document.getElementById("toast");
  const say = document.getElementById("say");
  document.getElementById("composer").addEventListener("submit", (e) => {
    e.preventDefault();
    if (!say.value.trim()) return;
    say.value = "";
    toast.textContent = L("Đã sửa.", "Done.");
    toast.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => (toast.hidden = true), 2600);
    outline.animate([{ backgroundColor: getComputedStyle(document.documentElement).getPropertyValue("--vang-soft") }, { backgroundColor: getComputedStyle(outline).backgroundColor }], { duration: 900 });
  });

  document.getElementById("go").addEventListener("click", () => {
    if (document.documentElement.dataset.state === "dang-soan") return;
    window.mockSet("state", "dang-soan");
    setTimeout(() => { location.href = "gv-04-gan-nhan.html"; }, 1200);
  });
})();
</script>
