<!doctype html>
<html lang="vi" data-age="thpt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khóa sắp có</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap&subset=vietnamese">
<link rel="stylesheet" href="shared.css">
<script src="shared.js"></script>
<script src="assets/soon/courses.js"></script>
<link rel="stylesheet" href="mascot.css"><script src="mascot.js" defer></script>
<style>
  /* A coming-soon course in the same outline as the course page (hs-04): one line per lesson, chapters fold open. */
  .main { max-width: 720px; display: grid; gap: 22px; padding-bottom: 80px; align-content: start; }
  .hero { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 16px; align-items: center; }
  .hero img { width: 64px; height: 64px; border-radius: 16px; object-fit: cover; border: 1px solid var(--rule); background: #FBF6EA; }
  .hero h1 { font-size: clamp(1.25em, 3.4vw, 1.6em); overflow-wrap: anywhere; }
  .hero .meta { color: var(--ink-2); font-size: .85em; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-top: 6px; }
  .side { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; background: var(--tim-soft); color: var(--tim-ink); font-weight: 600; font-size: .85em; }
  .side svg { width: 15px; height: 15px; }

  .tree { display: grid; gap: 2px; }
  .grp > summary { list-style: none; }
  .grp > summary::-webkit-details-marker { display: none; }
  .node { display: grid; grid-template-columns: 22px 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; min-height: 44px; padding: 0 10px 0 6px; border-radius: 10px; color: var(--ink); cursor: pointer; font: inherit; }
  summary.node:hover { background: var(--tim-soft); }
  .node:focus-visible { outline: 2px solid var(--tim); outline-offset: -2px; }
  .node > .chev svg { width: 16px; height: 16px; color: var(--ink-3); transform: rotate(-90deg); transition: transform .15s; }
  .grp[open] > summary .chev svg { transform: none; }
  .node > .ic svg { width: 19px; height: 19px; color: var(--ink-2); }
  .node .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grp > summary .t { font-weight: 600; }
  .node .end { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-3); font-size: .82em; }
  .node .end svg { width: 16px; height: 16px; }
  .kids { display: grid; gap: 2px; padding-left: 30px; }
  .kids .node { grid-template-columns: minmax(22px, auto) minmax(0, 1fr) auto; cursor: default; }
  .kids .no { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-size: .75em; font-weight: 600; color: var(--ink-2); border: 1px solid var(--rule-strong); }
  .kids .out { grid-template-columns: minmax(0, 1fr); padding: 6px 10px; color: var(--ink-2); }
  .kids .out .t { white-space: normal; }
  @media (max-width: 640px) { .kids { padding-left: 18px; } }
</style>
</head>
<body>
<div class="mock-bar">
  <a href="index.html">← Tất cả màn hình</a>
  <span class="mock-title">Học sinh: Khóa sắp có</span>
  <span class="mock-seg"><span>Ngôn ngữ</span><button data-set="lang:vi">VI</button><button data-set="lang:en">EN</button></span>
  <span class="mock-seg"><span>Nền</span><button data-set="theme:light">Sáng</button><button data-set="theme:dark">Tối</button></span>
  <span class="mock-note">Xem trước chương và bài; khóa chưa học được.</span>
</div>

<div class="app">
  <header class="topbar">
    <a class="icon-btn" href="hs-07-tim-khoa-hoc.html" aria-label="Tìm khóa học"><i data-i="back"></i></a>
    <h1 class="page-title" data-en="Courses">Khóa học</h1>
    <span class="grow"></span>
    <button class="icon-btn" type="button" data-settings aria-label="Cài đặt"><i data-i="gear"></i></button>
  </header>

  <main class="main">
    <section class="hero">
      <img id="c-img" alt="">
      <div>
        <h1 id="c-title"></h1>
        <div class="meta"><span id="c-meta"></span><span class="side"><i data-i="clock"></i><span data-en="Coming soon">Sắp có</span></span></div>
      </div>
    </section>
    <nav class="tree" id="c-tree" aria-label="Nội dung khóa"></nav>
  </main>
</div>
<script>
(function () {
  var D = window.SOON_DETAIL;
  var k = new URLSearchParams(location.search).get("c");
  if (!D[k]) k = "vat-li-12-dao-dong-co-va-song";
  var c = D[k], $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (m) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]; }); };
  var dur = function (m, en) { var h = Math.floor(m / 60), r = m % 60; return en ? (h ? h + " h" : "") + (h && r ? " " : "") + (r ? r + " min" : "") : (h ? h + " giờ" : "") + (h && r ? " " : "") + (r ? r + " phút" : ""); };
  var ICON = { reading: "text", video: "video", quiz: "quiz", audio: "volume", interactive: "grid" };
  document.title = c.t;
  $("c-img").src = "assets/soon/" + k + ".webp";
  $("c-title").textContent = c.t;
  $("c-meta").setAttribute("data-en", esc(c.te) + " · " + c.n + " lessons · " + dur(c.m, 1));
  $("c-meta").textContent = c.te + " · " + c.n + " bài · " + dur(c.m, 0);
  var kinds = c.med.map(function (m) { return '<i data-i="' + (ICON[m] || "text") + '"></i>'; }).join("");
  var no = 0, chev = '<span class="chev"><i data-i="chev"></i></span>';
  var html = c.tree.map(function (ch, i) {
    return '<details class="grp"' + (i === 0 || c.tree.length <= 3 ? " open" : "") + '><summary class="node">' + chev + '<span class="ic"><i data-i="book"></i></span><span class="t">' + esc(ch[0]) + '</span><span class="end">' + ch[1].length + "</span></summary><div class=\"kids\">" +
      ch[1].map(function (l) { no++; return '<div class="node"><span class="no">' + no + '</span><span class="t">' + esc(l) + '</span><span class="end">' + kinds + "</span></div>"; }).join("") + "</div></details>";
  }).join("");
  html += '<details class="grp">' + '<summary class="node">' + chev + '<span class="ic"><i data-i="target"></i></span><span class="t" data-en="After this you can">Học xong em sẽ</span><span class="end"></span></summary><div class="kids">' +
    c.o.map(function (o) { return '<div class="node out"><span class="t">' + esc(o) + "</span></div>"; }).join("") + "</div></details>";
  $("c-tree").innerHTML = html;
  if (window.mockPaint) window.mockPaint($("c-tree"));
})();
</script>
</body>
</html>
