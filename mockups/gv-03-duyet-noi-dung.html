<style>
  /* same on gv-01..03: header with step indicator */
  .steps { display: flex; gap: 4px; align-items: center; margin-left: 6px; }
  .steps a { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px 0 6px; border-radius: 99px; color: var(--ink-2); text-decoration: none; font-size: .88em; font-weight: 500; }
  .steps a:hover { background: var(--tim-soft); }
  .steps .n { width: 22px; height: 22px; border-radius: 99px; border: 1.5px solid var(--rule-strong); display: grid; place-items: center; font-size: .8em; font-weight: 600; }
  .steps a[aria-current] { color: var(--tim-ink); background: var(--tim-soft); font-weight: 600; }
  .steps a[aria-current] .n { background: var(--tim); color: var(--on-tim); border-color: transparent; }
  .topbar .btn.act { min-height: 44px; padding: 0 18px; white-space: nowrap; flex: none; }
  .pub[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
  .rejnote { margin: 0 0 14px; padding: 10px 14px; border-radius: var(--r-md); background: var(--do-soft); color: var(--do); font-weight: 500; }
  .pubwrap { display: flex; align-items: center; gap: 10px; }
  @media (max-width: 640px) { .steps .l { display: none; } .steps a { padding: 0 4px; } .topbar > a.icon-btn { display: none; } .topbar .logo .nm { display: none; } .topbar .btn.act { padding: 0 14px; } }

  .main { max-width: 1160px; }
  .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin-bottom: 6px; }
  .crumbs h1 { font-size: 1.15em; }
  .crumbs .pager { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); font-size: .9em; }
  .crumbs .pager .icon-btn { width: 38px; height: 38px; }
  .vernote { display: flex; gap: 8px; align-items: center; color: var(--ink-2); font-size: .85em; margin-bottom: 14px; }
  .vernote svg { width: 16px; height: 16px; color: var(--cam); flex: none; }

  /* course level: teacher confirms, agent only suggests. One flat row. */
  .lvbars { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; flex: none; }
  .lvbars i { display: block; width: 4px; border-radius: 1px; background: var(--rule-strong); }
  .lvbars i:nth-child(1) { height: 6px; } .lvbars i:nth-child(2) { height: 10px; } .lvbars i:nth-child(3) { height: 14px; }
  .lvbars i.on { background: var(--tim); }
  .levelrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--rule); }
  .levelrow.need .lv-label { color: var(--cam); }
  .lv-label { font-weight: 600; font-size: .92em; }
  .lv-seg { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .lv-opt { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--rule-strong); background: var(--paper); color: var(--ink); font: 500 .9em var(--font-ui); cursor: pointer; }
  .lv-opt:hover { border-color: var(--tim); }
  .lv-opt[aria-checked="true"] { border-color: var(--tim); background: var(--tim-soft); color: var(--tim-ink); font-weight: 600; box-shadow: inset 0 0 0 1px var(--tim); }
  .lv-opt .sug { font-style: normal; font-size: .8em; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--vang); color: #3A3000; }
  .lv-opt .sug[hidden] { display: none; }
  .lv-note { color: var(--ink-2); font-size: .85em; }
  .lv-ok { min-height: 40px; padding: 0 16px; }

  /* what is being reviewed: lesson / practice / test / listen */
  .tabs { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--tim-soft); margin-bottom: 18px; max-width: 100%; overflow-x: auto; }
  .tabs button { min-height: 38px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-2); font: 500 .9em var(--font-ui); cursor: pointer; white-space: nowrap; }
  .tabs button[aria-selected="true"] { background: var(--paper); color: var(--tim-ink); font-weight: 600; box-shadow: 0 1px 3px rgba(40, 30, 90, .18); }
  [hidden] { display: none !important; }

  /* lesson tab: steps | phone preview | fields */
  .rv { display: grid; grid-template-columns: 220px 340px minmax(0, 1fr); gap: 28px; align-items: start; }
  .rv-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; position: sticky; top: 64px; }
  .si { display: grid; grid-template-columns: 24px 20px minmax(0, 1fr) 10px; gap: 8px; align-items: center; width: 100%; min-height: 44px; padding: 0 10px 0 8px; border: 0; border-radius: 12px; background: transparent; color: var(--ink); font: 500 .92em var(--font-ui); text-align: left; cursor: pointer; }
  .si:hover { background: var(--tim-soft); }
  .si[aria-current="true"] { background: var(--tim-soft); color: var(--tim-ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--tim); }
  .si .sn { color: var(--ink-3); font-size: .85em; font-variant-numeric: tabular-nums; }
  .si svg { width: 18px; height: 18px; color: var(--ink-2); }
  .si .lb { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 9px; height: 9px; border-radius: 99px; }
  .dot.maybe { background: var(--vang); box-shadow: 0 0 0 1.5px var(--cam); }
  .dot.said { background: var(--do); }

  .phone { width: 100%; max-width: 340px; border-radius: 28px; border: 2px solid var(--rule-strong); background: var(--paper); box-shadow: var(--shadow); padding: 14px 16px 20px; position: sticky; top: 64px; min-height: 440px; }
  .pbar { height: 10px; border-radius: 99px; background: var(--rule-strong); overflow: hidden; margin: 2px 4px 16px; }
  .pbar i { display: block; height: 100%; background: var(--xanh); border-radius: inherit; }
  .pv { display: grid; gap: 14px; align-content: start; }
  .pv .ask { font-size: 1.1em; font-weight: 600; margin: 0; }
  .say { display: block; }
  .bub { position: relative; padding: 10px 14px; border-radius: 16px; border: 2px solid var(--rule-strong); background: var(--surface); line-height: 1.45; font-size: .95em; overflow-wrap: anywhere; }
  .bub::before { content: none; position: absolute; left: -8px; bottom: 14px; width: 12px; height: 12px; background: var(--surface); border-left: 2px solid var(--rule-strong); border-bottom: 2px solid var(--rule-strong); transform: rotate(45deg); }
  .speakb { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 10px; background: var(--tim); color: var(--on-tim); margin-right: 8px; vertical-align: middle; }
  .speakb svg { width: 18px; height: 18px; }
  .vi { display: inline-block; margin-left: 8px; padding: 0 8px; border-radius: 99px; border: 1.5px solid var(--rule-strong); color: var(--ink-2); font-size: .8em; font-weight: 600; }
  .gloss { margin: 0; color: var(--ink-2); font-size: .88em; padding-left: 0; }
  .mixchip { display: inline-flex; align-items: center; gap: 8px; justify-self: start; padding: 3px 10px; border-radius: 99px; background: var(--tim-soft); color: var(--tim-ink); font-size: .85em; font-weight: 600; }
  .mixchip i { width: 8px; height: 8px; border-radius: 99px; background: var(--rule-strong); display: inline-block; }
  .mixchip i.on { background: var(--tim); }
  .figure { border-radius: 16px; border: 2px solid var(--rule); background: var(--surface); padding: 10px; display: grid; place-items: center; color: var(--ink); }
  .figure svg { width: 100%; max-width: 280px; height: auto; }
  .readout { margin: 0; font-size: .85em; color: var(--ink-2); text-align: center; }
  .pics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pic { position: relative; display: grid; gap: 4px; justify-items: center; align-content: center; min-height: 64px; padding: 8px; border-radius: 14px; border: 2px solid var(--rule-strong); background: var(--surface); box-shadow: 0 3px 0 var(--rule-strong); font-weight: 600; font-size: .95em; text-align: center; }
  .pic svg.p { width: 100%; max-width: 120px; height: auto; }
  .pic.right { border-color: var(--xanh); background: var(--xanh-soft); box-shadow: 0 3px 0 var(--xanh); }
  .pic .ck { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; color: var(--xanh); }
  .slots { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 48px; padding: 6px 2px; border-bottom: 2px solid var(--rule-strong); font-family: var(--font-read); font-size: 1.15em; }
  .slots .gap { min-width: 56px; min-height: 40px; border-radius: 12px; border: 2px dashed var(--tim); background: var(--tim-soft); }
  .bank { display: flex; flex-wrap: wrap; gap: 8px; }
  .tile { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 12px; border: 2px solid var(--rule-strong); background: var(--surface); box-shadow: 0 3px 0 var(--rule-strong); font-weight: 500; font-size: .95em; }
  .tile.right { border-color: var(--xanh); background: var(--xanh-soft); box-shadow: 0 3px 0 var(--xanh); }
  .tile b { color: var(--tim-ink); font-size: .85em; }
  .pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ideas { display: grid; gap: 6px; }
  .ideas .tile { box-shadow: none; border-color: var(--xanh); background: var(--xanh-soft); min-height: 36px; }

  /* fields */
  .fields { display: grid; gap: 14px; align-content: start; min-width: 0; }
  .fields h2 { font-size: 1em; margin: 0; display: flex; align-items: center; gap: 8px; }
  .fields h2 svg { width: 20px; height: 20px; color: var(--ink-2); }
  .f { display: grid; gap: 5px; border: 0; padding: 0; margin: 0; min-width: 0; }
  .fl { font-size: .85em; font-weight: 600; color: var(--ink-2); }
  .f input[type="text"], .f input[type="number"], .f textarea, .cbox input, .trow input { width: 100%; min-height: 42px; padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--rule-strong); background: var(--paper); color: var(--ink); }
  .f textarea { resize: vertical; line-height: 1.45; }
  .f input:focus, .f textarea:focus, .cbox input:focus, .trow input:focus { outline: none; border-color: var(--tim); box-shadow: 0 0 0 3px var(--tim-soft); }
  .orow { display: grid; grid-template-columns: 22px 22px minmax(0, 1fr); gap: 8px; align-items: center; }
  .orow input[type="radio"] { width: 20px; height: 20px; accent-color: var(--xanh); margin: 0; }
  .orow b { color: var(--tim-ink); font-size: .9em; }
  .onote { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: center; margin: 2px 0 4px 52px; font-size: .85em; color: var(--ink-2); }
  .onote input { min-height: 38px; }
  .prow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  .nrow { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: center; }
  .nrow b { color: var(--ink-3); font-size: .85em; text-align: center; }
  .mixr { display: flex; align-items: center; gap: 12px; }
  .mixr input { flex: 1; accent-color: var(--tim); }
  .mixr span { font-weight: 600; min-width: 4.5em; font-size: .9em; }
  .unsure { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: var(--cam-soft); color: var(--cam); font-size: .9em; font-weight: 500; }
  .unsure svg { width: 18px; height: 18px; flex: none; }
  .unsure .btn { margin-left: auto; min-height: 36px; padding: 0 12px; font-size: .9em; }
  .btn.say-b { justify-self: start; min-height: 40px; padding: 0 14px; font-size: .9em; gap: 8px; }
  .btn.say-b svg { width: 18px; height: 18px; }
  .cbox { display: grid; grid-template-columns: 22px minmax(0, 1fr) 42px; gap: 8px; align-items: center; margin-top: 4px; padding-top: 12px; border-top: 1px solid var(--rule); }
  .cbox > svg { width: 20px; height: 20px; color: var(--do); }
  .cbox .icon-btn { width: 42px; height: 42px; }

  /* practice tab: level folds | question editor */
  .pl { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: 28px; align-items: start; }
  .lvl { border-bottom: 1px solid var(--rule); }
  .lvl > button { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; min-height: 52px; padding: 0 6px; border: 0; background: transparent; font: 600 1em var(--font-ui); color: var(--ink); text-align: left; cursor: pointer; }
  .lvl > button svg { width: 20px; height: 20px; transition: transform .2s; color: var(--ink-2); }
  .lvl.open > button svg { transform: rotate(180deg); }
  .lvl > button .ct { color: var(--ink-2); font-weight: 500; font-size: .88em; }
  .qs { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 2px; }
  .qrow { display: grid; grid-template-columns: 26px minmax(0, 1fr) minmax(0, 36%) 18px; gap: 10px; align-items: center; width: 100%; min-height: 48px; padding: 4px 10px; border: 0; border-radius: 12px; background: transparent; text-align: left; font: .92em var(--font-ui); color: var(--ink); cursor: pointer; }
  .qrow:hover { background: var(--tim-soft); }
  .qrow[aria-current="true"] { background: var(--tim-soft); box-shadow: inset 3px 0 0 var(--tim); }
  .qrow .qn { color: var(--ink-3); font-size: .9em; }
  .qrow .qs1, .qrow .qa { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qrow .qa { color: var(--xanh); font-weight: 600; font-size: .9em; }
  .qrow svg { width: 16px; height: 16px; color: var(--cam); }
  @media (max-width: 560px) {
    .qrow { grid-template-columns: 22px minmax(0, 1fr) 18px; }
    .qrow .qa { grid-column: 2; grid-row: 2; }
    .qrow svg { grid-column: 3; grid-row: 1; }
  }
  .none { color: var(--ink-3); font-size: .9em; padding: 12px 4px; }

  /* test tab */
  .trows { display: grid; gap: 4px; max-width: 760px; }
  .trow { display: grid; grid-template-columns: minmax(0, 1fr) 120px 120px; gap: 14px; align-items: center; padding: 10px 6px; border-bottom: 1px solid var(--rule); }
  .trow b { font-weight: 600; }
  .trow label { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: .9em; }
  .trow input { width: 68px; text-align: center; font-variant-numeric: tabular-nums; }
  .tcom { max-width: 760px; margin-top: 14px; }
  @media (max-width: 560px) { .trow { grid-template-columns: 1fr 1fr; } .trow b { grid-column: 1 / -1; } }

  /* listen tab */
  .chs { display: grid; gap: 22px; max-width: 760px; }
  .ch { border-bottom: 1px solid var(--rule); padding-bottom: 18px; }
  .ch-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 10px; }
  .ch-h h2 { font-size: 1em; margin: 0; }
  .ch-h .dur { color: var(--ink-2); font-size: .88em; }
  .ch-h .btn { min-height: 40px; padding: 0 14px; font-size: .9em; gap: 8px; }
  .ch-h .btn svg { width: 18px; height: 18px; }
  .ch-h .grow { flex: 1; }
  .ptts { height: 4px; border-radius: 99px; background: var(--rule-strong); overflow: hidden; margin-bottom: 10px; }
  .ptts i { display: block; height: 100%; width: 0; background: var(--tim); }
  .ptts.run i { width: 100%; transition: width 5s linear; }
  .ch textarea { width: 100%; min-height: 64px; padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--rule-strong); background: var(--paper); color: var(--ink); line-height: 1.5; resize: vertical; margin-bottom: 8px; font-family: var(--font-read); }
  .ch textarea:focus { outline: none; border-color: var(--tim); box-shadow: 0 0 0 3px var(--tim-soft); }

  /* margin comments: one line each, icon + text + status */
  .panel { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--rule); }
  .notes { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 2px 16px; }
  .note { display: grid; grid-template-columns: 26px minmax(0, 1fr) 20px; gap: 10px; align-items: start; padding: 8px 8px; border-radius: 10px; cursor: pointer; font-size: .92em; border-left: 3px solid transparent; }
  .note:hover { background: var(--tim-soft); }
  .note.active { border-left-color: var(--do); background: var(--tim-soft); }
  .note .n { width: 26px; height: 26px; border-radius: 99px; border: 2px solid var(--do); color: var(--do); display: grid; place-items: center; }
  .note .n svg { width: 14px; height: 14px; }
  .note.fixed .n { border-color: var(--xanh); color: var(--xanh); }
  .note .where { color: var(--ink-3); font-size: .88em; font-weight: 500; margin-right: 6px; }
  .note .said { margin: 0; }
  .note .st { color: var(--cam); margin-top: 2px; }
  .note.fixed .st { color: var(--xanh); }
  .note .st svg { width: 18px; height: 18px; }

  @media (max-width: 1000px) {
    .rv { grid-template-columns: 340px minmax(0, 1fr); }
    .rv-list { grid-column: 1 / -1; position: static; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .si { width: auto; flex: none; grid-template-columns: 18px max-content 9px; padding: 0 14px 0 10px; min-height: 40px; border: 1.5px solid var(--rule-strong); border-radius: 99px; }
    .si .sn { display: none; }
    .si[aria-current="true"] { box-shadow: inset 0 0 0 1px var(--tim); border-color: var(--tim); }
    .pl { grid-template-columns: 1fr; }
    .phone, .rv .fields { position: static; }
  }
  @media (max-width: 720px) { .rv { grid-template-columns: 1fr; } .phone { margin: 0 auto; min-height: 0; } }
</style>
</head>

    switch (s.k) {
      case "read":
        return (anh ? sayHTML(s.en, true, '<span class="vi">VI</span>') + gl(s.gloss) + mixHTML(s.mix) : sayHTML(s.muc, speak)) + (s.fig && s.fig !== "none" ? '<div class="figure">' + FIG[s.fig] + "</div>" : "");
      case "pick": case "calc":
        return (kid ? '<p class="ask"><span class="speakb">' + ico("volume") + "</span>" + esc(s.ask) + "</p>" : '<p class="ask">' + esc(s.ask) + "</p>") + gl(s.gloss).replace("padding-left", "padding-left") + '<div class="pics">' + s.opts.map((o, i) => optHTML(s, o, i)).join("") + "</div>";
      case "tiles":
        return '<p class="ask">' + L("Điền chỗ trống", "Fill the gap") + '</p><div class="slots"><span>' + esc(s.stem) + '</span><span class="gap"></span></div><div class="bank">' + s.opts.map((o, i) => '<span class="tile' + (i === s.right ? " right" : "") + '">' + esc(o.t) + "</span>").join("") + "</div>";
      case "pairs":
        return '<p class="ask">' + L("Nối đơn vị", "Match the units") + '</p><div class="pairs">' + s.pairs.map((p) => '<span class="tile">' + esc(p[0]) + '</span><span class="tile">' + esc(p[1]) + "</span>").join("") + "</div>";
      case "order":
        return '<p class="ask">' + L("Xếp thứ tự", "Put in order") + '</p><div class="bank">' + s.items.map((t, i) => '<span class="tile"><b>' + (i + 1) + "</b>" + esc(t) + "</span>").join("") + "</div>";
      case "drag":
        return '<p class="ask">' + (kid ? '<span class="speakb">' + ico("volume") + "</span>" : "") + esc(s.lead + s.target) + '</p><div class="figure">' + FIG[s.fig] + "</div>" + (s.fig === "drag" ? '<p class="readout">r = 0,10 m · E = 18 000 V/m</p>' : "") + sayHTML(s.praise, kid);
      case "recall":
        return sayHTML(s.muc, speak, '<br><small>1/' + s.ideas.filter(Boolean).length + "</small>") + gl(s.gloss) + '<div class="ideas">' + s.ideas.filter(Boolean).map((t) => '<span class="tile">' + esc(t) + "</span>").join("") + "</div>";
    }
    return "";
  }
  function paintPreview() {
    const st = cur().steps, s = st[ui.step];
    $("pv").innerHTML = previewHTML(s);
    $("pfill").style.width = ((ui.step + 1) / (st.length + 1)) * 100 + "%";
  }

  // ---------- editor: only the fields that apply to the item ----------
  const rePrev = () => { if (ui.tab === "bai") paintPreview(); };
  function inp(o, key, ph, type) {
    const i = h("input"); i.type = type || "text"; i.value = o[key] == null ? "" : o[key];
    if (ph) i.placeholder = ph;
    i.addEventListener("input", () => { o[key] = type === "number" ? i.value : i.value; rePrev(); });
    return i;
  }
  function area(o, key, rows) {
    const t = h("textarea"); t.rows = rows || 2; t.value = o[key] || "";
    t.addEventListener("input", () => { o[key] = t.value; rePrev(); });
    return t;
  }
  function fld(label, ctl, group) {
    const w = h(group ? "div" : "label", "f");
    if (group) w.setAttribute("role", "group");
    const l = h("span", "fl"); l.textContent = label; w.appendChild(l);
    if (group) w.setAttribute("aria-label", label);
    w.appendChild(ctl);
    return w;
  }
  function speakBtn() {
    const b = h("button", "btn btn-ghost say-b", ico("volume") + "<span>" + L("Nghe giọng đọc", "Hear it read") + "</span>");
    b.type = "button";
    b.addEventListener("click", () => { b.querySelector("span").textContent = L("Đang đọc…", "Reading…"); setTimeout(() => { b.querySelector("span").textContent = L("Nghe giọng đọc", "Hear it read"); }, 1800); });
    return b;
  }
  function optGroup(s, host, redo) {
    const g = h("div");
    g.style.display = "grid"; g.style.gap = "6px";
    s.opts.forEach((o, i) => {
      const row = h("div", "orow");
      const r = h("input"); r.type = "radio"; r.name = "right"; r.checked = i === s.right;
      r.setAttribute("aria-label", L("Đáp án đúng: ", "Right answer: ") + LET[i]);
      r.addEventListener("change", () => { s.right = i; redo(); });
      row.appendChild(r);
      row.appendChild(h("b", "", LET[i]));
      const ph = s.style === "pic" ? "+ −" : s.style === "basket" ? L("Số táo", "Apples") : "";
      row.appendChild(inp(o, "t", ph, s.style === "basket" ? "number" : "text"));
      g.appendChild(row);
      if (i !== s.right) {
        const n = h("label", "onote"); n.appendChild(h("span", "", L("Nếu chọn ", "If ") + LET[i] + (en() ? " is picked:" : ":")));
        n.appendChild(inp(o, "note", L("Ghi chú khi sửa lỗi", "Note for fixing")));
        g.appendChild(n);
      }
    });
    return g;
  }
  function commentBox(host, ctx, whereTxt) {
    const f = h("form", "cbox", ico("comment"));
    const i = h("input"); i.type = "text"; i.placeholder = L("Nhận xét cho Mentor", "Note for Mentor"); i.setAttribute("aria-label", i.placeholder);
    f.appendChild(i);
    const b = h("button", "icon-btn", ico("send")); b.type = "submit"; b.setAttribute("aria-label", L("Gửi", "Send"));
    f.appendChild(b);
    f.addEventListener("submit", (e) => {
      e.preventDefault();
      const said = i.value.trim(); if (!said) return;
      const c = Object.assign({ k: KHOA(), said, fixed: false }, ctx);
      list.push(c); i.value = ""; renderNotes();
      setTimeout(() => { c.fixed = true; renderNotes(); }, 3500); // Mentor applies it on its own
    });
    host.appendChild(f);
  }
  function unsureBar(host, o, after) {
    if (!o.unsure) return;
    const b = h("div", "unsure", ico("flag") + "<span>" + L("Mentor chưa chắc phần này.", "Mentor isn't sure about this.") + "</span>");
    const ok = h("button", "btn btn-ghost", L("Đã xem", "Checked")); ok.type = "button";
    ok.addEventListener("click", () => { o.unsure = false; after(); });
    b.appendChild(ok); host.appendChild(b);
  }

  function editor(s, host, ctx, after, head) {
    host.innerHTML = "";
    const kid = KHOA() === "tieu-hoc", anh = KHOA() === "anh";
    const add = (x) => host.appendChild(x);
    const redo = () => { editor(s, host, ctx, after, head); rePrev(); after(true); };
    if (head) add(head);
    unsureBar(host, s, () => { redo(); });
    if (s.k === "read") {
      if (anh) {
        add(fld(L("Tiếng Anh", "English"), area(s, "en", 2)));
        add(fld(L("Nghĩa tiếng Việt", "Vietnamese gloss"), area(s, "gloss", 2)));
        const mx = h("div", "mixr"); const r = h("input"); r.type = "range"; r.min = 0; r.max = 100; r.step = 10; r.value = s.mix;
        r.setAttribute("aria-label", L("Tiếng Việt", "Vietnamese"));
        const sp = h("span", "", L("Tiếng Việt ", "Vietnamese ") + s.mix + "%");
        r.addEventListener("input", () => { s.mix = +r.value; sp.textContent = L("Tiếng Việt ", "Vietnamese ") + s.mix + "%"; rePrev(); });
        mx.appendChild(r); mx.appendChild(sp);
        add(fld(L("Lúc bắt đầu", "Starting mix"), mx, true));
      } else add(fld(L("Lời giải thích", "Explanation text"), area(s, "muc", 2)));
      if (kid) add(speakBtn());
    }
    if (s.k === "pick" || s.k === "calc") {
      add(fld(L("Câu hỏi", "Question"), area(s, "ask", 2)));
      if (anh) add(fld(L("Nghĩa tiếng Việt", "Vietnamese gloss"), inp(s, "gloss")));
      if (kid) add(speakBtn());
    }
    if (s.k === "tiles") add(fld(L("Công thức", "Formula"), inp(s, "stem")));
    if (s.opts) add(fld(L("Đáp án, chọn cái đúng", "Options, mark the right one"), optGroup(s, host, redo), true));
    if (s.k === "pairs") {
      const g = h("div"); g.style.display = "grid"; g.style.gap = "6px";
      s.pairs.forEach((p) => {
        const r = h("div", "prow");
        [0, 1].forEach((j) => { const i = h("input"); i.type = "text"; i.value = p[j]; i.setAttribute("aria-label", j ? L("Vế phải", "Right side") : L("Vế trái", "Left side")); i.addEventListener("input", () => { p[j] = i.value; rePrev(); }); r.appendChild(i); });
        g.appendChild(r);
      });
      add(fld(L("Các cặp", "Pairs"), g, true));
    }
    if (s.k === "order") {
      const g = h("div"); g.style.display = "grid"; g.style.gap = "6px";
      s.items.forEach((t, j) => {
        const r = h("div", "nrow", "<b>" + (j + 1) + "</b>");
        const i = h("input"); i.type = "text"; i.value = t; i.setAttribute("aria-label", L("Bước ", "Step ") + (j + 1));
        i.addEventListener("input", () => { s.items[j] = i.value; rePrev(); });
        r.appendChild(i); g.appendChild(r);
      });
      add(fld(L("Thứ tự đúng", "Right order"), g, true));
    }
    if (s.k === "drag") {
      add(fld(L("Mục tiêu", "Target"), inp(s, "target")));
      add(fld(L("Lời khen", "Praise"), area(s, "praise", 1)));
      if (kid) add(speakBtn());
    }
    if (s.k === "recall") {
      add(fld(L("Câu hỏi gợi nhớ", "Recall question"), area(s, "muc", 1)));
      if (anh) add(fld(L("Nghĩa tiếng Việt", "Vietnamese gloss"), inp(s, "gloss")));
      const g = h("div"); g.style.display = "grid"; g.style.gap = "6px";
      while (s.ideas.length < 3) s.ideas.push("");
      s.ideas.forEach((t, j) => {
        const r = h("div", "nrow", "<b>" + (j + 1) + "</b>");
        const i = h("input"); i.type = "text"; i.value = t; if (j > 0) i.placeholder = L("Thêm ý", "Add idea");
        i.setAttribute("aria-label", L("Ý ", "Idea ") + (j + 1));
        i.addEventListener("input", () => { s.ideas[j] = i.value; rePrev(); });
        r.appendChild(i); g.appendChild(r);
      });
      add(fld(L("Ý chính, 2 đến 3 ý", "Key ideas, 2 to 3"), g, true));
    }
    if ("why" in s) add(fld(L("Giải thích", "Explanation"), inp(s, "why")));
    commentBox(host, ctx);
  }

  // ---------- tabs ----------
  function steps() {
    const ul = $("slist"); ul.innerHTML = "";
    cur().steps.forEach((s, i) => {
      const said = list.some((c) => c.k === KHOA() && c.tab === "bai" && c.step === i && !c.fixed);
      const li = h("li"), b = h("button", "si");
      b.type = "button";
      b.setAttribute("aria-current", String(i === ui.step));
      const lab = en() && s.labelEn ? s.labelEn : s.label;
      b.innerHTML = '<span class="sn">' + (i + 1) + "</span>" + ico(KIND_ICON[s.k]) + '<span class="lb"></span><span class="dot' + (said ? " said" : s.unsure ? " maybe" : "") + '"></span>';
      b.querySelector(".lb").textContent = lab;
      const note = said ? L("Có nhận xét", "Has a comment") : s.unsure ? L("Mentor chưa chắc", "Mentor unsure") : "";
      if (note) b.title = note;
      b.setAttribute("aria-label", (i + 1) + ". " + lab + (note ? ", " + note : ""));
      b.addEventListener("click", () => { ui.step = i; paintLesson(); });
      li.appendChild(b); ul.appendChild(li);
    });
  }
  function paintLesson() {
    steps(); paintPreview();
    const s = cur().steps[ui.step];
    const hd = h("h2", "", ico(KIND_ICON[s.k]));
    hd.appendChild(document.createTextNode(L("Bước ", "Step ") + (ui.step + 1) + " · " + (en() && s.labelEn ? s.labelEn : s.label)));
    editor(s, $("rv-fields"), { tab: "bai", step: ui.step }, steps, hd);
  }

  function paintPractice() {
    const root = $("levels"); root.innerHTML = "";
    const prac = cur().prac;
    if (ui.lv >= prac.length) ui.lv = 0;
    prac.forEach((lv, li) => {
      const open = li === ui.lv;
      const d = h("div", "lvl" + (open ? " open" : ""));
      const b = h("button", "", ico("chev") + "<span></span><span class='ct'></span>");
      b.type = "button"; b.setAttribute("aria-expanded", String(open));
      b.children[1].textContent = en() && lv.nEn ? lv.nEn : lv.n;
      b.children[2].textContent = lv.qs.length + L(" câu", " questions");
      b.addEventListener("click", () => { ui.lv = open ? -1 : li; ui.q = null; paintPractice(); });
      d.appendChild(b);
      if (open) {
        const ul = h("ul", "qs");
        lv.qs.forEach((q, qi) => {
          const r = h("button", "qrow", '<span class="qn">' + (qi + 1) + '</span><span class="qs1"></span><span class="qa"></span>' + (q.unsure ? ico("flag") : "<span></span>"));
          r.type = "button"; r.setAttribute("aria-current", String(ui.q === qi));
          r.querySelector(".qs1").textContent = q.ask;
          r.querySelector(".qa").textContent = q.opts[q.right].t;
          if (q.unsure) r.setAttribute("aria-label", q.ask + ", " + L("Mentor chưa chắc", "Mentor unsure"));
          r.addEventListener("click", () => { ui.q = qi; paintPractice(); if (innerWidth <= 1000) $("q-fields").scrollIntoView({ behavior: smooth, block: "nearest" }); });
          const li2 = h("li"); li2.appendChild(r); ul.appendChild(li2);
        });
        d.appendChild(ul);
      }
      root.appendChild(d);
    });
    const host = $("q-fields");
    const q = ui.lv >= 0 && ui.q != null ? prac[ui.lv].qs[ui.q] : null;
    if (!q) { host.innerHTML = '<p class="none">' + L("Chọn một câu để sửa.", "Pick a question to edit.") + "</p>"; return; }
    const hd = h("h2", "", ico("quiz")); hd.appendChild(document.createTextNode((en() && prac[ui.lv].nEn ? prac[ui.lv].nEn : prac[ui.lv].n) + " · " + L("câu ", "Q") + (ui.q + 1)));
    editor(Object.assign(q, { k: "pick" }), host, { tab: "luyen", lv: ui.lv, q: ui.q }, () => paintPracticeRows(), hd);
  }
  function paintPracticeRows() {
    // keep the editor focus; only refresh rows
    const prac = cur().prac;
    document.querySelectorAll("#levels .qrow").forEach((r, qi) => {
      const q = prac[ui.lv].qs[qi]; if (!q) return;
      r.querySelector(".qs1").textContent = q.ask; r.querySelector(".qa").textContent = q.opts[q.right].t;
      const f = r.querySelector("svg"); if (f && !q.unsure) f.outerHTML = "<span></span>";
    });
  }

  function paintTests() {
    const root = $("trows"); root.innerHTML = "";
    cur().tests.forEach((t) => {
      const r = h("div", "trow", "<b></b>");
      r.firstChild.textContent = en() && t.nEn ? t.nEn : t.n;
      [["q", L("câu", "questions"), L("Số câu", "Questions")], ["m", L("phút", "min"), L("Thời gian", "Time")]].forEach(([k, u, al]) => {
        const lab = h("label"); const i = h("input"); i.type = "number"; i.min = 1; i.value = t[k]; i.setAttribute("aria-label", (en() && t.nEn ? t.nEn : t.n) + ": " + al);
        i.addEventListener("input", () => { t[k] = i.value; });
        lab.appendChild(i); lab.appendChild(document.createTextNode(u)); r.appendChild(lab);
      });
      root.appendChild(r);
    });
    const c = $("tcom"); c.innerHTML = ""; commentBox(c, { tab: "kiem" });
  }

  const playing = new Set();
  function paintListen() {
    const root = $("chs"); root.innerHTML = "";
    cur().listen.forEach((ch, ci) => {
      const d = h("article", "ch");
      const hd = h("div", "ch-h", "<h2></h2><span class='dur'></span><span class='grow'></span>");
      hd.firstChild.textContent = en() && ch.tEn ? ch.tEn : ch.t;
      hd.querySelector(".dur").textContent = ch.min + L(" phút", " min");
      const key = KHOA() + ci, on = playing.has(key);
      const pb = h("button", "btn btn-ghost", ico("play") + "<span></span>"); pb.type = "button";
      pb.querySelector("span").textContent = on ? L("Dừng", "Stop") : L("Nghe thử", "Preview");
      const bar = h("div", "ptts" + (on ? " run" : ""), "<i></i>");
      pb.addEventListener("click", () => {
        if (playing.has(key)) { playing.delete(key); bar.classList.remove("run"); pb.querySelector("span").textContent = L("Nghe thử", "Preview"); return; }
        playing.add(key); pb.querySelector("span").textContent = L("Dừng", "Stop");
        bar.classList.remove("run"); void bar.offsetWidth; bar.classList.add("run");
        setTimeout(() => { if (playing.delete(key)) { bar.classList.remove("run"); pb.querySelector("span").textContent = L("Nghe thử", "Preview"); } }, 5200);
      });
      hd.appendChild(pb); d.appendChild(hd); d.appendChild(bar);
      ch.paras.forEach((p, pi) => {
        const t = h("textarea"); t.rows = 2; t.value = p; t.setAttribute("aria-label", L("Đoạn ", "Paragraph ") + (pi + 1));
        t.addEventListener("input", () => { ch.paras[pi] = t.value; });
        d.appendChild(t);
      });
      commentBox(d, { tab: "nghe", ch: ci });
      root.appendChild(d);
    });
  }

  // ---------- margin comments ----------
  function whereOf(c) {
    const d = cur();
    if (c.tab === "bai") return L("Bước ", "Step ") + (c.step + 1);
    if (c.tab === "luyen") { const lv = d.prac[c.lv]; return lv ? (en() && lv.nEn ? lv.nEn : lv.n) + " · " + L("câu ", "Q") + (c.q + 1) : L("Luyện tập", "Practice"); }
    if (c.tab === "kiem") return L("Kiểm tra", "Tests");
    const ch = d.listen[c.ch]; return ch ? (en() && ch.tEn ? ch.tEn : ch.t).split(" · ")[0] : L("Nghe tóm tắt", "Listen");
  }
  const iconOf = (c) => c.tab === "bai" ? KIND_ICON[(cur().steps[c.step] || {}).k] || "comment" : c.tab === "luyen" ? "quiz" : c.tab === "nghe" ? "volume" : "clock";
  function go(c) {
    ui.tab = c.tab; if (c.tab === "bai") ui.step = c.step;
    if (c.tab === "luyen") { ui.lv = c.lv; ui.q = c.q; }
    show();
  }
  function renderNotes() {
    const notes = $("notes"); notes.innerHTML = "";
    const mine = list.filter((c) => c.k === KHOA());
    $("notes").parentElement.hidden = !mine.length;
    mine.forEach((c) => {
      const li = h("li", "note" + (c.fixed ? " fixed" : ""));
      li.tabIndex = 0;
      li.innerHTML = '<span class="n">' + ico(iconOf(c)) + '</span><span><span class="where"></span><span class="said"></span></span><span class="st" role="img">' + ico(c.fixed ? "check" : "refresh") + "</span>";
      li.querySelector(".where").textContent = whereOf(c);
      li.querySelector(".said").textContent = (en() && c.saidEn) || c.said;
      const st = li.querySelector(".st"); st.setAttribute("aria-label", c.fixed ? L("Đã sửa", "Fixed") : L("Đang sửa", "Fixing")); st.title = st.getAttribute("aria-label");
      const jump = () => { go(c); li.classList.add("active"); };
      li.addEventListener("click", jump);
      li.addEventListener("keydown", (e) => { if (e.key === "Enter") jump(); });
      notes.appendChild(li);
    });
    if (ui.tab === "bai") steps();
  }

  function show() {
    document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === ui.tab)));
    ["bai", "luyen", "kiem", "nghe"].forEach((t) => ($("t-" + t).hidden = t !== ui.tab));
    $("title").textContent = en() ? cur().titleEn : cur().title;
    if (ui.tab === "bai") { if (ui.step >= cur().steps.length) ui.step = 0; paintLesson(); }
    if (ui.tab === "luyen") paintPractice();
    if (ui.tab === "kiem") paintTests();
    if (ui.tab === "nghe") paintListen();
    renderNotes();
  }
  document.querySelectorAll("#tabs button").forEach((b) => b.addEventListener("click", () => { ui.tab = b.dataset.tab; show(); }));

  // ---------- difficulty: read-only, set in the Tags step (gv-04) ----------
  const KHO = { "Cơ bản": ["Basic", 1], "Nâng cao": ["Advanced", 2], "Luyện thi": ["Exam prep", 3] };
  function lvRender() {
    let v = "Cơ bản"; try { v = localStorage.getItem("mentor.kho") || v; } catch (e) {}
    const k = KHO[v] || KHO["Cơ bản"];
    $("lv-txt").textContent = en() ? k[0] : (KHO[v] ? v : "Cơ bản");
    document.querySelectorAll("#lv-val .lvbars i").forEach((i, n) => i.classList.toggle("on", n < k[1]));
  }

  // ---------- publish ----------
  const toast = $("toast");
  function say(t) { toast.textContent = t; toast.hidden = false; clearTimeout(say.t); say.t = setTimeout(() => (toast.hidden = true), 3200); }
  // one publish action: "Gửi duyệt" goes to the owner's queue; the course shows as Chờ duyệt in the list
  const q = new URLSearchParams(location.search);
  [$("pub"), $("pub2")].forEach((b) => {
    b.addEventListener("click", () => {
      const id = q.get("course") || (b.id === "pub2" ? "bayes" : "toan1");
      try { const m = JSON.parse(sessionStorage.getItem("mentor-mock-sent") || "{}"); m[id] = 1; sessionStorage.setItem("mentor-mock-sent", JSON.stringify(m)); } catch (e) {}
      say(L("Đã gửi duyệt.", "Sent for review."));
      setTimeout(() => { location.href = "gv-01-gui-bai.html?state=co-khoa"; }, 900);
    });
  });
  if (q.get("why")) { const r = $("rejnote"); r.textContent = L("Lần trước bị từ chối: ", "Rejected last time: ") + q.get("why"); r.hidden = false; }

  let lastKhoa = null;
  function refresh() {
    if (lastKhoa !== KHOA()) { lastKhoa = KHOA(); ui.step = 0; ui.lv = 0; ui.q = null; }
    lvRender(); show();
  }
  document.addEventListener("DOMContentLoaded", refresh);
  document.addEventListener("mock:change", (e) => { if (e.detail && (e.detail.key === "khoa" || e.detail.key === "lang")) requestAnimationFrame(refresh); else lvRender(); });
})();
</script>
</body>
</html>
