<text x="50" y="220" font-family="Lexend, sans-serif" font-size="26" fill="#5A4BC0" stroke="#F7F1E3" stroke-width="6" paint-order="stroke" text-anchor="start">Introduction: what it is</text>
<text x="80" y="150" font-family="Lexend, sans-serif" font-size="26" fill="#5A4BC0" stroke="#F7F1E3" stroke-width="6" paint-order="stroke" text-anchor="start">First detail</text>
<text x="490" y="220" font-family="Lexend, sans-serif" font-size="26" fill="#5A4BC0" stroke="#F7F1E3" stroke-width="6" paint-order="stroke" text-anchor="start">Also, second detail</text>
<text x="950" y="150" font-family="Lexend, sans-serif" font-size="26" fill="#5A4BC0" stroke="#F7F1E3" stroke-width="6" paint-order="stroke" text-anchor="end">Finally: feeling / I like it because</text>
