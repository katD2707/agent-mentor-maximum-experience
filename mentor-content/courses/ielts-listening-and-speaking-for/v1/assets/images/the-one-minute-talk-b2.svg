<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
<defs>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3"/>
    <feColorMatrix values="0 0 0 0 0.35 0 0 0 0 0.3 0 0 0 0 0.5 0 0 0 0.10 0"/>
  </filter>
  <clipPath id="barclip"><rect x="90" y="320" width="820" height="70" rx="18"/></clipPath>
</defs>
<rect width="1000" height="700" fill="#F7F1E3"/>
