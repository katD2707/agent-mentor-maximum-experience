<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
<defs>
<filter id="grain">
<feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3"/>
<feColorMatrix values="0 0 0 0 0.35 0 0 0 0 0.3 0 0 0 0 0.5 0 0 0 0.10 0"/>
</filter>
<clipPath id="barclip"><rect x="120" y="300" width="760" height="100" rx="14"/></clipPath>
</defs>
<rect x="0" y="0" width="1000" height="700" fill="#F7F1E3"/>
<g clip-path="url(#barclip)">
<rect x="120" y="300" width="475" height="100" fill="#E9E5F6"/>
<rect x="595" y="300" width="285" height="100" fill="#F0D76E"/>
</g>
<rect x="120" y="300" width="760" height="100" rx="14" fill="none" stroke="#5A4BC0" stroke-width="4" stroke-linejoin="round"/>
<line x1="595" y1="300" x2="595" y2="400" stroke="#5A4BC0" stroke-width="4" stroke-linecap="round"/>
<text x="357.5" y="250" font-family="Lexend, sans-serif" font-size="30" text-anchor="middle" fill="#2B283F" stroke="#F7F1E3" stroke-width="6" paint-order="stroke">s&#7889; hi&#7879;u trang (20 bit)</text>
<text x="737.5" y="250" font-family="Lexend, sans-serif" font-size="30" text-anchor="middle" fill="#2B283F" stroke="#F7F1E3" stroke-width="6" paint-order="stroke">offset (12 bit)</text>
<rect x="0" y="0" width="1000" height="700" filter="url(#grain)"/>
</svg>