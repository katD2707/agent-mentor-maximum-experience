<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#F7F1E3"/>

  <!-- ground shadow -->
  <ellipse cx="200" cy="344" rx="104" ry="13" fill="#E9E5F6"/>

  <!-- stem -->
  <path d="M200 152 C202 130 206 112 210 98" fill="none" stroke="#5A4BC0" stroke-width="13" stroke-linecap="round"/>

  <!-- yellow leaf (back, left) -->
  <path d="M198 106 C182 80 154 66 128 72 C132 98 160 118 198 106 Z" fill="#F0D76E" stroke="#5A4BC0" stroke-width="5" stroke-linejoin="round"/>
  <path d="M191 102 C168 94 148 84 136 76" fill="none" stroke="#2B283F" stroke-width="3" stroke-linecap="round" opacity="0.55"/>

  <!-- apple body -->
  <path d="M200 150
           C186 126 152 114 128 132
           C100 152 92 196 100 236
           C108 278 136 320 168 328
           C182 331 192 324 200 314
           C208 324 218 331 232 328
           C264 320 292 278 300 236
           C308 196 300 152 272 132
           C248 114 214 126 200 150 Z"
        fill="#E8806A" stroke="#5A4BC0" stroke-width="5" stroke-linejoin="round"/>

  <!-- mint leaf (front, right) -->
  <path d="M206 108 C226 82 262 70 288 78 C282 106 246 124 206 108 Z" fill="#9FD8BF" stroke="#5A4BC0" stroke-width="5" stroke-linejoin="round"/>
  <path d="M212 105 C236 96 258 86 274 79" fill="none" stroke="#2B283F" stroke-width="3" stroke-linecap="round" opacity="0.55"/>

  <!-- gloss -->
  <ellipse cx="156" cy="194" rx="26" ry="15" fill="#F7F1E3" opacity="0.9" transform="rotate(-28 156 194)"/>
  <ellipse cx="146" cy="172" rx="11" ry="7" fill="#F7F1E3" opacity="0.75" transform="rotate(-28 146 172)"/>

  <!-- paper grain -->
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3"/>
    <feColorMatrix values="0 0 0 0 0.35 0 0 0 0 0.3 0 0 0 0 0.5 0 0 0 0.10 0"/>
  </filter>
  <rect width="400" height="400" filter="url(#grain)"/>
</svg>