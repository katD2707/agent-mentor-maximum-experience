      <rect x="-23" y="-16" width="46" height="32" rx="15" fill="#9FD8BF" stroke="#5A4BC0" stroke-width="4"/>
      <path d="M-12,-7 Q-4,-12 4,-10" fill="none" stroke="#F7F1E3" stroke-width="3"/>
