      <path d="M-36,-19 L-21,-12 L-21,12 L-36,19 L-29,0 Z" fill="#E9E5F6" stroke="#5A4BC0" stroke-width="4"/>
      <path d="M36,-19 L21,-12 L21,12 L36,19 L29,0 Z" fill="#E9E5F6" stroke="#5A4BC0" stroke-width="4"/>
