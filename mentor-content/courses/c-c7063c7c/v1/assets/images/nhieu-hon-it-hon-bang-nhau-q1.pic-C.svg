    <circle cx="200" cy="215" r="130" fill="#E9E5F6" stroke="#5A4BC0" stroke-width="6"/>
    <circle cx="200" cy="215" r="104" fill="#F7F1E3" stroke="#5A4BC0" stroke-width="4"/>

    <!-- candy 1 : top left, mint -->
    <g transform="translate(168,150) rotate(-14)">
      <path d="M-36,-19 L-21,-12 L-21,12 L-36,19 L-29,0 Z" fill="#E9E5F6" stroke="#5A4BC0" stroke-width="4"/>
      <path d="M36,-19 L21,-12 L21,12 L36,19 L29,0 Z" fill="#E9E5F6" stroke="#5A4BC0" stroke-width="4"/>
      <rect x="-23" y="-16" width="46" height="32" rx="15" fill="#9FD8BF" stroke="#5A4BC0" stroke-width="4"/>
      <path d="M-12,-7 Q-4,-12 4,-10" fill="none" stroke="#F7F1E3" stroke-width="3"/>
    </g>

    <!-- candy 2 : top right, yellow -->
    <g transform="translate(240,152) rotate(14)">
      <path d="M-36,-19 L-21,-12 L-21,12 L-36,19 L-29,0 Z" fill="#E9E5F6" stroke="#5A4BC0" stroke-width="4"/>
      <path d="M36,-19 L21,-12 L21,12 L36,19 L29,0 Z" fill="#E9E5F6" stroke="#5A4BC0" stroke-width="4"/>
