      <path d="M-12,-7 Q-4,-12 4,-10" fill="none" stroke="#F7F1E3" stroke-width="3"/>
    </g>

    <!-- candy 3 : middle left, upright, yellow -->
    <g transform="translate(128,214) rotate(-90)">
      <path d="M-36,-19 L-21,-12 L-21,12 L-36,19 L-29,0 Z" fill="#E9E5F6" stroke="#5A4BC0" stroke-width="4"/>
      <path d="M36,-19 L21,-12 L21,12 L36,19 L29,0 Z" fill="#E9E5F6" stroke="#5A4BC0" stroke-width="4"/>
      <rect x="-23" y="-16" width="46" height="32" rx="15" fill="#F0D76E" stroke="#5A4BC0" stroke-width="4"/>
      <path d="M-12,-7 Q-4,-12 4,-10" fill="none" stroke="#F7F1E3" stroke-width="3"/>
