<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.35 0 0 0 0 0.3 0 0 0 0 0.5 0 0 0 0.10 0"/>
    </filter>
  </defs>

  <!-- paper -->
  <rect width="400" height="400" fill="#F7F1E3"/>

  <!-- highlighter halo -->
  <circle cx="200" cy="228" r="124" fill="#F0D76E"/>

  <!-- basket handle (behind everything) -->
  <path d="M 96 246 C 96 80 304 80 304 246" fill="none" stroke="#5A4BC0" stroke-width="13" stroke-linecap="round"/>

  <!-- basket body -->
  <path d="M 80 250 L 116 332 Q 200 350 284 332 L 320 250 Z" fill="#5A4BC0"/>

  <!-- weave -->
  <g fill="none" stroke="#E9E5F6" stroke-width="5.5" stroke-linecap="round">
    <path d="M 140 278 C 143 306 146 326 149 336"/>
    <path d="M 200 278 C 200 306 200 330 200 344"/>
    <path d="M 260 278 C 257 306 254 326 251 336"/>
    <path d="M 100 300 Q 200 312 300 300"/>
    <path d="M 110 322 Q 200 334 290 322"/>
  </g>

  <!-- rim -->
  <ellipse cx="200" cy="250" rx="122" ry="26" fill="#5A4BC0"/>

  <!-- back apple -->
  <circle cx="200" cy="198" r="38" fill="#E8806A" stroke="#5A4BC0" stroke-width="5"/>
  <path d="M 200 164 C 202 152 206 146 212 142" fill="none" stroke="#2B283F" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="224" cy="140" rx="13" ry="7.5" transform="rotate(-20 224 140)" fill="#9FD8BF" stroke="#5A4BC0" stroke-width="3"/>

  <!-- left apple -->
  <circle cx="140" cy="228" r="36" fill="#E8806A" stroke="#5A4BC0" stroke-width="5"/>
  <path d="M 140 196 C 140 182 145 174 154 168" fill="none" stroke="#2B283F" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="168" cy="164" rx="15" ry="8.5" transform="rotate(-25 168 164)" fill="#9FD8BF" stroke="#5A4BC0" stroke-width="3"/>

  <!-- right apple -->
  <circle cx="260" cy="228" r="36" fill="#E8806A" stroke="#5A4BC0" stroke-width="5"/>
  <path d="M 260 196 C 260 182 255 174 246 168" fill="none" stroke="#2B283F" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="232" cy="164" rx="15" ry="8.5" transform="rotate(25 232 164)" fill="#9FD8BF" stroke="#5A4BC0" stroke-width="3"/>

  <!-- front lip of the basket, tucking the apples in -->
  <path d="M 78 250 A 122 26 0 0 0 322 250 Z" fill="#5A4BC0"/>

  <!-- paper grain -->
  <rect width="400" height="400" filter="url(#grain)"/>
</svg>