<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <clipPath id="body">
      <path d="M108,200 L292,200 L262,318 Q259,332 245,332 L155,332 Q141,332 138,318 Z"/>
    </clipPath>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="400" height="400" fill="#F7F1E3"/>

  <!-- soft shadow on the ground -->
  <ellipse cx="200" cy="340" rx="86" ry="12" fill="#E9E5F6"/>

  <!-- basket body -->
  <g clip-path="url(#body)">
    <rect x="100" y="196" width="200" height="54" fill="#F0D76E"/>
    <rect x="100" y="250" width="200" height="44" fill="#9FD8BF"/>
    <rect x="100" y="294" width="200" height="46" fill="#E9E5F6"/>
    <g stroke="#5A4BC0" stroke-width="2.5" stroke-linecap="round" opacity="0.75">
      <line x1="142" y1="196" x2="142" y2="340"/>
      <line x1="171" y1="196" x2="171" y2="340"/>
      <line x1="200" y1="196" x2="200" y2="340"/>
      <line x1="229" y1="196" x2="229" y2="340"/>
      <line x1="258" y1="196" x2="258" y2="340"/>
    </g>
  </g>

  <!-- body outline -->
  <path d="M108,200 L292,200 L262,318 Q259,332 245,332 L155,332 Q141,332 138,318 Z"
        fill="none" stroke="#5A4BC0" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- handle: purple backing then coral -->
  <path d="M120,198 C120,80 280,80 280,198" fill="none" stroke="#5A4BC0" stroke-width="26" stroke-linecap="round"/>
  <path d="M120,198 C120,80 280,80 280,198" fill="none" stroke="#E8806A" stroke-width="13" stroke-linecap="round"/>

  <!-- rim -->
  <rect x="96" y="186" width="208" height="28" rx="14" fill="#5A4BC0"/>
  <rect x="112" y="194" width="176" height="6" rx="3" fill="#E9E5F6" opacity="0.55"/>

  <!-- thin detail dots on the body -->
  <g fill="#2B283F" opacity="0.55">
    <circle cx="160" cy="322" r="2.6"/>
    <circle cx="200" cy="322" r="2.6"/>
    <circle cx="240" cy="322" r="2.6"/>
  </g>

  <!-- paper grain -->
  <rect x="0" y="0" width="400" height="400" filter="url(#grain)"/>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3"/>
    <feColorMatrix values="0 0 0 0 0.35 0 0 0 0 0.3 0 0 0 0 0.5 0 0 0 0.10 0"/>
  </filter>
</svg>