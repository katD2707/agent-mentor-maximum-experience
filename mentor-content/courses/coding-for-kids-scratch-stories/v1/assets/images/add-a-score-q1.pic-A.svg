<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.35 0 0 0 0 0.3 0 0 0 0 0.5 0 0 0 0.10 0"/>
    </filter>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="400" height="400" fill="#F7F1E3"/>

  <!-- yellow halo -->
  <circle cx="200" cy="200" r="148" fill="#F0D76E"/>

  <!-- box body -->
  <rect x="104" y="118" width="192" height="176" rx="24" fill="#F7F1E3" stroke="#5A4BC0" stroke-width="9"/>

  <!-- lid band -->
  <rect x="114" y="128" width="172" height="42" rx="14" fill="#5A4BC0"/>

  <!-- badge on the lid -->
  <circle cx="200" cy="149" r="12" fill="#F0D76E"/>

  <!-- tally strokes -->
  <g stroke="#5A4BC0" stroke-width="11" stroke-linecap="round">
    <line x1="164" y1="205" x2="164" y2="258"/>
    <line x1="188" y1="205" x2="188" y2="258"/>
    <line x1="212" y1="205" x2="212" y2="258"/>
    <line x1="236" y1="205" x2="236" y2="258"/>
  </g>

  <!-- the fifth mark -->
  <line x1="152" y1="253" x2="248" y2="209" stroke="#E8806A" stroke-width="11" stroke-linecap="round"/>

  <!-- small mint accents -->
  <circle cx="128" cy="272" r="7" fill="#9FD8BF"/>
  <circle cx="272" cy="272" r="7" fill="#9FD8BF"/>

  <!-- paper grain -->
  <rect x="0" y="0" width="400" height="400" filter="url(#grain)"/>
</svg>