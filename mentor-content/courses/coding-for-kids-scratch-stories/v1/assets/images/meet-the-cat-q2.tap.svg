<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- soft ground shadow -->
  <ellipse cx="200" cy="320" rx="98" ry="13" fill="#E9E5F6"/>

  <!-- rounded silhouette used to clip the faces -->
  <defs>
    <clipPath id="cubeClip">
      <path d="M 154,105
               L 286,105
               Q 300,105 300,119
               L 300,251
               Q 300,265 290.1,274.9
               L 269.9,295.1
               Q 260,305 246,305
               L 114,305
               Q 100,305 100,291
               L 100,159
               Q 100,145 109.9,135.1
               L 130.1,114.9
               Q 140,105 154,105
               Z"/>
    </clipPath>
  </defs>

  <!-- faces -->
  <g clip-path="url(#cubeClip)">
    <!-- front face -->
    <rect x="90" y="95" width="220" height="220" fill="#5A4BC0"/>
    <!-- top face -->
    <path d="M 100,145 L 260,145 L 300,105 L 140,105 Z" fill="#E9E5F6"/>
    <!-- side face -->
    <path d="M 260,145 L 300,105 L 300,265 L 260,305 Z" fill="#9FD8BF"/>

    <!-- studs on the top face -->
    <ellipse cx="152" cy="134.6" rx="12" ry="7" fill="#5A4BC0"/>
    <ellipse cx="228.8" cy="134.6" rx="12" ry="7" fill="#5A4BC0"/>
    <ellipse cx="171.2" cy="115.4" rx="12" ry="7" fill="#5A4BC0"/>
    <ellipse cx="248" cy="115.4" rx="12" ry="7" fill="#5A4BC0"/>
  </g>

  <!-- internal cube edges -->
  <g stroke="#2B283F" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M 104,145 L 256,145"/>
    <path d="M 262,143.5 L 298,107"/>
    <path d="M 260,148 L 260,302"/>
  </g>

  <!-- outer outline -->
  <path d="M 154,105
           L 286,105
           Q 300,105 300,119
           L 300,251
           Q 300,265 290.1,274.9
           L 269.9,295.1
           Q 260,305 246,305
           L 114,305
           Q 100,305 100,291
           L 100,159
           Q 100,145 109.9,135.1
           L 130.1,114.9
           Q 140,105 154,105
           Z"
        fill="none" stroke="#2B283F" stroke-width="3" stroke-linejoin="round"/>

  <!-- paper grain -->
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3"/>
    <feColorMatrix values="0 0 0 0 0.35 0 0 0 0 0.3 0 0 0 0 0.5 0 0 0 0.10 0"/>
  </filter>
  <rect x="0" y="0" width="400" height="400" filter="url(#grain)"/>
</svg>