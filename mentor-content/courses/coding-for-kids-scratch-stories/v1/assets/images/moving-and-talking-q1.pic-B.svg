<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.35 0 0 0 0 0.3 0 0 0 0 0.5 0 0 0 0.10 0"/>
    </filter>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="400" height="400" fill="#F7F1E3"/>

  <!-- soft shadow under the pole -->
  <ellipse cx="140" cy="340" rx="56" ry="12" fill="#E9E5F6"/>

  <!-- flagpole -->
  <rect x="131" y="64" width="18" height="270" rx="9" fill="#5A4BC0"/>

  <!-- waving flag cloth -->
  <path d="M148 92
           C 194 70 252 112 300 90
           C 310 124 310 158 300 192
           C 252 214 194 172 148 194 Z"
        fill="#9FD8BF" stroke="#5A4BC0" stroke-width="7"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- finial on top of the pole -->
  <circle cx="140" cy="60" r="12" fill="#F0D76E" stroke="#5A4BC0" stroke-width="6"/>

  <!-- little motion accents -->
  <path d="M316 122 q 12 -14 22 -2" fill="none" stroke="#2B283F" stroke-width="5"
        stroke-linecap="round" opacity="0.35"/>
  <path d="M316 158 q 12 -14 22 -2" fill="none" stroke="#2B283F" stroke-width="5"
        stroke-linecap="round" opacity="0.35"/>

  <!-- paper grain -->
  <rect x="0" y="0" width="400" height="400" filter="url(#grain)"/>
</svg>