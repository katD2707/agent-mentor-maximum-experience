<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect x="0" y="0" width="400" height="400" fill="#F7F1E3"/>

  <!-- soft ground shadow -->
  <ellipse cx="200" cy="266" rx="120" ry="10" fill="#E9E5F6"/>

  <!-- right puzzle bump -->
  <rect x="334" y="180" width="18" height="36" rx="9" fill="#5A4BC0"/>

  <!-- main block body -->
  <rect x="55" y="142" width="290" height="112" rx="24" fill="#5A4BC0"/>

  <!-- left puzzle socket -->
  <rect x="55" y="180" width="16" height="36" rx="8" fill="#F7F1E3"/>

  <!-- inner pill -->
  <rect x="72" y="164" width="256" height="68" rx="34" fill="#E9E5F6"/>

  <!-- motion chevron -->
  <path d="M96 184 L112 200 L96 216" fill="none" stroke="#F0D76E" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ten dots: upper row of five -->
  <circle cx="150" cy="188" r="7.5" fill="#E8806A"/>
  <circle cx="190" cy="188" r="7.5" fill="#E8806A"/>
  <circle cx="230" cy="188" r="7.5" fill="#E8806A"/>
  <circle cx="270" cy="188" r="7.5" fill="#E8806A"/>
  <circle cx="310" cy="188" r="7.5" fill="#E8806A"/>

  <!-- lower row of five -->
  <circle cx="150" cy="212" r="7.5" fill="#9FD8BF"/>
  <circle cx="190" cy="212" r="7.5" fill="#9FD8BF"/>
  <circle cx="230" cy="212" r="7.5" fill="#9FD8BF"/>
  <circle cx="270" cy="212" r="7.5" fill="#9FD8BF"/>
  <circle cx="310" cy="212" r="7.5" fill="#9FD8BF"/>

  <!-- paper grain -->
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3"/>
    <feColorMatrix values="0 0 0 0 0.35 0 0 0 0 0.3 0 0 0 0 0.5 0 0 0 0.10 0"/>
  </filter>
  <rect x="0" y="0" width="400" height="400" filter="url(#grain)"/>
</svg>