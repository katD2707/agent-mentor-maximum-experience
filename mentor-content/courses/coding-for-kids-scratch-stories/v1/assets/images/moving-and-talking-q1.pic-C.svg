<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- paper -->
  <rect width="400" height="400" fill="#F7F1E3"/>

  <!-- soft ground shadow -->
  <ellipse cx="200" cy="350" rx="106" ry="10" fill="#E9E5F6"/>

  <!-- bottom block -->
  <g transform="rotate(-1 200 292)">
    <rect x="112" y="240" width="176" height="104" rx="16" fill="#E8806A" stroke="#5A4BC0" stroke-width="5" stroke-linejoin="round"/>
    <rect x="125" y="253" width="150" height="78" rx="10" fill="none" stroke="#5A4BC0" stroke-width="3" stroke-linejoin="round"/>
    <path d="M200 266 L226 292 L200 318 L174 292 Z" fill="#F0D76E" stroke="#5A4BC0" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- middle block -->
  <g transform="rotate(1.4 200 197)">
    <rect x="134" y="150" width="132" height="94" rx="15" fill="#9FD8BF" stroke="#5A4BC0" stroke-width="5" stroke-linejoin="round"/>
    <rect x="147" y="163" width="106" height="68" rx="9" fill="none" stroke="#5A4BC0" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="200" cy="197" r="24" fill="#E8806A" stroke="#5A4BC0" stroke-width="4"/>
  </g>

  <!-- top block -->
  <g transform="rotate(-2 200 107)">
    <rect x="150" y="64" width="100" height="86" rx="14" fill="#F0D76E" stroke="#5A4BC0" stroke-width="5" stroke-linejoin="round"/>
    <rect x="163" y="77" width="74" height="60" rx="8" fill="none" stroke="#5A4BC0" stroke-width="3" stroke-linejoin="round"/>
    <path d="M200 85 L205.58 99.31 L220.92 100.20 L209.04 109.94 L212.93 124.80 L200 116.5 L187.07 124.80 L190.96 109.94 L179.08 100.20 L194.42 99.31 Z"
          fill="#5A4BC0" stroke="#5A4BC0" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- paper grain -->
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3"/>
    <feColorMatrix values="0 0 0 0 0.35 0 0 0 0 0.3 0 0 0 0 0.5 0 0 0 0.10 0"/>
  </filter>
  <rect width="400" height="400" filter="url(#grain)"/>
</svg>