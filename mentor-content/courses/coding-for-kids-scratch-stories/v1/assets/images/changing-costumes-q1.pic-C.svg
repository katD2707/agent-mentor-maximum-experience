<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- paper background -->
  <rect width="400" height="400" fill="#F7F1E3"/>

  <!-- soft ground shadow -->
  <ellipse cx="200" cy="350" rx="54" ry="12" fill="#9FD8BF"/>

  <!-- pole -->
  <rect x="189" y="240" width="22" height="110" rx="11" fill="#5A4BC0"/>
  <rect x="195" y="254" width="5" height="86" rx="2.5" fill="#F7F1E3" opacity="0.35"/>

  <!-- cream rim of the octagon -->
  <polygon points="297,215.2 240.2,271.8 159.8,271.8 103,215.2 103,134.8 159.8,78.2 240.2,78.2 297,134.8"
           fill="#F7F1E3" stroke="#5A4BC0" stroke-width="5" stroke-linejoin="round"/>

  <!-- coral face of the octagon -->
  <polygon points="281.3,208.7 233.7,256.3 166.3,256.3 118.7,208.7 118.7,141.3 166.3,93.7 233.7,93.7 281.3,141.3"
           fill="#E8806A" stroke="#5A4BC0" stroke-width="3" stroke-linejoin="round"/>

  <!-- gentle highlight arc -->
  <path d="M148 122 Q166 104 190 102" fill="none" stroke="#F7F1E3" stroke-width="8"
        stroke-linecap="round" opacity="0.5"/>

  <!-- small friendly sparkle emblem -->
  <path d="M200 150 C202 166 206 170 222 175 C206 180 202 184 200 200 C198 184 194 180 178 175 C194 170 198 166 200 150 Z"
        fill="#F7F1E3"/>

  <!-- paper grain -->
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3"/>
    <feColorMatrix values="0 0 0 0 0.35 0 0 0 0 0.3 0 0 0 0 0.5 0 0 0 0.10 0"/>
  </filter>
  <rect width="400" height="400" filter="url(#grain)"/>
</svg>