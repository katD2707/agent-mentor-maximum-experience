<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.35 0 0 0 0 0.3 0 0 0 0 0.5 0 0 0 0.10 0"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="#F7F1E3"/>

  <g transform="rotate(-6 200 200)" stroke-linecap="round" stroke-linejoin="round">

    <!-- soft shadow -->
    <ellipse cx="212" cy="338" rx="116" ry="15" fill="#E9E5F6"/>

    <!-- page block -->
    <rect x="116" y="88" width="180" height="236" rx="14" fill="#F7F1E3" stroke="#5A4BC0" stroke-width="3"/>

    <!-- page edges (thin details) -->
    <g stroke="#2B283F" stroke-width="1.6">
      <line x1="286" y1="108" x2="286" y2="304"/>
      <line x1="291" y1="108" x2="291" y2="304"/>
      <line x1="128" y1="317" x2="288" y2="317"/>
      <line x1="128" y1="321" x2="288" y2="321"/>
    </g>

    <!-- bookmark ribbon -->
    <polygon points="236,244 256,244 256,342 246,330 236,342" fill="#E8806A"/>

    <!-- cover -->
    <rect x="100" y="76" width="180" height="236" rx="14" fill="#5A4BC0"/>

    <!-- spine creases -->
    <g stroke="#E9E5F6" stroke-width="2.6">
      <line x1="113" y1="94" x2="113" y2="294"/>
      <line x1="121" y1="94" x2="121" y2="294"/>
    </g>

    <!-- yellow label -->
    <rect x="138" y="152" width="104" height="72" rx="10" fill="#F0D76E"/>
    <line x1="156" y1="178" x2="228" y2="178" stroke="#5A4BC0" stroke-width="6"/>
    <line x1="156" y1="198" x2="206" y2="198" stroke="#5A4BC0" stroke-width="6"/>

    <!-- mint page tab -->
    <rect x="278" y="122" width="24" height="46" rx="8" fill="#9FD8BF"/>
  </g>

  <rect width="400" height="400" filter="url(#grain)"/>
</svg>