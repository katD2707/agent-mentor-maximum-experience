<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.35 0 0 0 0 0.3 0 0 0 0 0.5 0 0 0 0.10 0"/>
    </filter>
  </defs>

  <!-- paper -->
  <rect width="400" height="400" fill="#F7F1E3"/>

  <!-- soft ink wash disc behind the object -->
  <circle cx="200" cy="200" r="148" fill="#E9E5F6"/>

  <g transform="rotate(-6 200 196)">

    <!-- back half (mirrored) -->
    <g transform="translate(400 0) scale(-1 1)">
      <line x1="200" y1="195" x2="240" y2="298" stroke="#E8806A" stroke-width="22" stroke-linecap="round"/>
      <circle cx="240" cy="298" r="21" fill="#E9E5F6"/>
      <circle cx="240" cy="298" r="30" fill="none" stroke="#E8806A" stroke-width="20"/>
      <path d="M212.1 190.2 L152.6 62.2 Q143.5 53 143.4 65.8 L187.9 199.8 Z" fill="#5A4BC0" stroke-linejoin="round"/>
    </g>

    <!-- front half -->
    <g>
      <line x1="200" y1="195" x2="240" y2="298" stroke="#E8806A" stroke-width="22" stroke-linecap="round"/>
      <circle cx="240" cy="298" r="21" fill="#E9E5F6"/>
      <circle cx="240" cy="298" r="30" fill="none" stroke="#E8806A" stroke-width="20"/>
      <path d="M212.1 190.2 L152.6 62.2 Q143.5 53 143.4 65.8 L187.9 199.8 Z" fill="#5A4BC0" stroke-linejoin="round"/>
    </g>

    <!-- pivot screw -->
    <circle cx="200" cy="195" r="18" fill="#F0D76E" stroke="#5A4BC0" stroke-width="5"/>
    <line x1="191" y1="201" x2="209" y2="189" stroke="#2B283F" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- small warm accents -->
  <path d="M72 100 q3 14 17 17 q-14 3 -17 17 q-3 -14 -17 -17 q14 -3 17 -17 z" fill="#F0D76E"/>
  <circle cx="330" cy="150" r="9" fill="#9FD8BF"/>
  <circle cx="85" cy="300" r="8" fill="#E8806A"/>

  <!-- paper grain -->
  <rect width="400" height="400" filter="url(#grain)"/>
</svg>