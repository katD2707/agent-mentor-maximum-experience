<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.35 0 0 0 0 0.3 0 0 0 0 0.5 0 0 0 0.10 0"/>
    </filter>
  </defs>

  <!-- paper -->
  <rect width="400" height="400" fill="#F7F1E3"/>

  <!-- folded-back flap on the right -->
  <polygon points="289,88 327,116 327,284 289,312"
           fill="#9FD8BF" stroke="#5A4BC0" stroke-width="5"
           stroke-linejoin="round"/>

  <!-- small glue tab on the left -->
  <rect x="71" y="150" width="30" height="100" rx="9"
        fill="#E8806A" stroke="#5A4BC0" stroke-width="5"/>

  <!-- the panel face -->
  <rect x="97" y="88" width="192" height="224" rx="16"
        fill="#E9E5F6" stroke="#5A4BC0" stroke-width="5"/>

  <!-- fold creases -->
  <line x1="136" y1="106" x2="136" y2="294" stroke="#2B283F" stroke-width="2.5"
        stroke-linecap="round" stroke-dasharray="7 8"/>
  <line x1="250" y1="106" x2="250" y2="294" stroke="#2B283F" stroke-width="2.5"
        stroke-linecap="round" stroke-dasharray="7 8"/>

  <!-- strip of tape over the fold -->
  <rect x="265" y="152" width="48" height="96" rx="12"
        fill="#F0D76E" stroke="#5A4BC0" stroke-width="4"/>

  <!-- paper grain -->
  <rect width="400" height="400" filter="url(#grain)"/>
</svg>