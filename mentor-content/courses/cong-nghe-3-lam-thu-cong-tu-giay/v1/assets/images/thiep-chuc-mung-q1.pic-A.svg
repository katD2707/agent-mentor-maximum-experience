<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.35 0 0 0 0 0.3 0 0 0 0 0.5 0 0 0 0.10 0"/>
    </filter>
  </defs>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- soft ground shadow -->
    <ellipse cx="186" cy="338" rx="88" ry="9" fill="#E9E5F6"/>

    <!-- back cover of the folded card -->
    <rect x="105" y="95" width="170" height="230" rx="12" fill="#5A4BC0"
          transform="translate(-16,-10) rotate(-4 190 210)"/>

    <!-- front cover -->
    <rect x="105" y="95" width="170" height="230" rx="12" fill="#E9E5F6"
          stroke="#5A4BC0" stroke-width="5"/>

    <!-- dotted decorative border -->
    <rect x="122" y="112" width="136" height="196" rx="10" fill="none"
          stroke="#5A4BC0" stroke-width="3.5" stroke-dasharray="0.1 12"/>

    <!-- central flower medallion -->
    <g transform="translate(190 208)">
      <ellipse cx="0" cy="-26" rx="13" ry="22" fill="#F0D76E"/>
      <ellipse cx="0" cy="-26" rx="13" ry="22" fill="#F0D76E" transform="rotate(60)"/>
      <ellipse cx="0" cy="-26" rx="13" ry="22" fill="#F0D76E" transform="rotate(120)"/>
      <ellipse cx="0" cy="-26" rx="13" ry="22" fill="#F0D76E" transform="rotate(180)"/>
      <ellipse cx="0" cy="-26" rx="13" ry="22" fill="#F0D76E" transform="rotate(240)"/>
      <ellipse cx="0" cy="-26" rx="13" ry="22" fill="#F0D76E" transform="rotate(300)"/>
      <circle cx="0" cy="0" r="16" fill="#E8806A"/>
      <circle cx="0" cy="0" r="6" fill="#F7F1E3"/>
    </g>

    <!-- upper accents -->
    <circle cx="190" cy="134" r="5" fill="#9FD8BF"/>
    <path d="M0 -10 C1.4 -3.2 3.2 -1.4 10 0 C3.2 1.4 1.4 3.2 0 10 C-1.4 3.2 -3.2 1.4 -10 0 C-3.2 -1.4 -1.4 -3.2 0 -10 Z"
          fill="#5A4BC0" transform="translate(146 140) scale(0.8)"/>
    <path d="M0 -10 C1.4 -3.2 3.2 -1.4 10 0 C3.2 1.4 1.4 3.2 0 10 C-1.4 3.2 -3.2 1.4 -10 0 C-3.2 -1.4 -1.4 -3.2 0 -10 Z"
          fill="#E8806A" transform="translate(236 138) scale(0.7)"/>

    <!-- lower accents -->
    <path d="M0 -10 C1.4 -3.2 3.2 -1.4 10 0 C3.2 1.4 1.4 3.2 0 10 C-1.4 3.2 -3.2 1.4 -10 0 C-3.2 -1.4 -1.4 -3.2 0 -10 Z"
          fill="#5A4BC0" transform="translate(148 288) scale(0.7)"/>
    <path d="M0 -10 C1.4 -3.2 3.2 -1.4 10 0 C3.2 1.4 1.4 3.2 0 10 C-1.4 3.2 -3.2 1.4 -10 0 C-3.2 -1.4 -1.4 -3.2 0 -10 Z"
          fill="#5A4BC0" transform="translate(236 282) scale(0.85)"/>
    <circle cx="190" cy="292" r="5" fill="#9FD8BF"/>
    <circle cx="166" cy="294" r="3.5" fill="#E8806A"/>
    <circle cx="214" cy="294" r="3.5" fill="#E8806A"/>
  </g>

  <!-- paper grain -->
  <rect width="400" height="400" filter="url(#grain)"/>
</svg>