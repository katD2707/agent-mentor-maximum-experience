<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.35 0 0 0 0 0.3 0 0 0 0 0.5 0 0 0 0.10 0"/>
    </filter>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="400" height="400" fill="#F7F1E3"/>

  <g transform="rotate(-12 200 200)" stroke-linecap="round" stroke-linejoin="round">
    <!-- soft shadow -->
    <rect x="50" y="176" width="306" height="68" rx="14" fill="#E9E5F6"/>

    <!-- ruler body -->
    <rect x="45" y="165" width="310" height="70" rx="14"
          fill="#F0D76E" stroke="#5A4BC0" stroke-width="5"/>

    <!-- mint stripe along the lower edge -->
    <rect x="54" y="217" width="292" height="7" rx="3.5" fill="#9FD8BF"/>

    <!-- tick marks: long ticks every third -->
    <line x1="70" y1="172" x2="70" y2="204" stroke="#5A4BC0" stroke-width="5"/>
    <line x1="90" y1="172" x2="90" y2="186" stroke="#5A4BC0" stroke-width="4"/>
    <line x1="110" y1="172" x2="110" y2="186" stroke="#5A4BC0" stroke-width="4"/>
    <line x1="130" y1="172" x2="130" y2="204" stroke="#5A4BC0" stroke-width="5"/>
    <line x1="150" y1="172" x2="150" y2="186" stroke="#5A4BC0" stroke-width="4"/>
    <line x1="170" y1="172" x2="170" y2="186" stroke="#5A4BC0" stroke-width="4"/>
    <line x1="190" y1="172" x2="190" y2="204" stroke="#5A4BC0" stroke-width="5"/>
    <line x1="210" y1="172" x2="210" y2="186" stroke="#5A4BC0" stroke-width="4"/>
    <line x1="230" y1="172" x2="230" y2="186" stroke="#5A4BC0" stroke-width="4"/>
    <line x1="250" y1="172" x2="250" y2="204" stroke="#5A4BC0" stroke-width="5"/>
    <line x1="270" y1="172" x2="270" y2="186" stroke="#5A4BC0" stroke-width="4"/>
    <line x1="290" y1="172" x2="290" y2="186" stroke="#5A4BC0" stroke-width="4"/>
    <line x1="310" y1="172" x2="310" y2="204" stroke="#5A4BC0" stroke-width="5"/>

    <!-- hanging hole -->
    <circle cx="336" cy="200" r="7" fill="#E8806A" stroke="#5A4BC0" stroke-width="4"/>
  </g>

  <!-- paper grain -->
  <rect x="0" y="0" width="400" height="400" fill="#F7F1E3" filter="url(#grain)"/>
</svg>