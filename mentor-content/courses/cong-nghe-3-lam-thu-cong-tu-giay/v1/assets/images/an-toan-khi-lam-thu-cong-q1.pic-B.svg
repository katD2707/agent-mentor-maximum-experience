<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.35 0 0 0 0 0.3 0 0 0 0 0.5 0 0 0 0.10 0"/>
    </filter>
  </defs>

  <!-- paper ground -->
  <rect width="400" height="400" fill="#F7F1E3"/>

  <!-- cast shadow -->
  <ellipse cx="200" cy="348" rx="82" ry="13" fill="#E9E5F6"/>

  <!-- glass body -->
  <path d="M172 128 L172 150 C172 168 134 174 134 202 L134 316 Q134 344 162 344 L238 344 Q266 344 266 316 L266 202 C266 174 228 168 228 150 L228 128 Z"
        fill="#E9E5F6" stroke="#5A4BC0" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- body shine -->
  <rect x="148" y="214" width="14" height="74" rx="7" fill="#F7F1E3"/>

  <!-- label -->
  <rect x="164" y="200" width="72" height="100" rx="16" fill="#F0D76E" stroke="#5A4BC0" stroke-width="5"/>

  <!-- glue drop emblem -->
  <path d="M200 224 C200 224 222 248 222 258 A22 22 0 1 1 178 258 C178 248 200 224 200 224 Z" fill="#5A4BC0"/>
  <circle cx="191" cy="256" r="4.5" fill="#F7F1E3"/>

  <!-- mint collar -->
  <rect x="162" y="124" width="76" height="26" rx="13" fill="#9FD8BF" stroke="#5A4BC0" stroke-width="6"/>

  <!-- coral lid -->
  <rect x="158" y="72" width="84" height="56" rx="16" fill="#E8806A" stroke="#5A4BC0" stroke-width="6"/>

  <!-- lid ridges -->
  <path d="M182 90 L182 112 M200 90 L200 112 M218 90 L218 112"
        stroke="#2B283F" stroke-width="3" stroke-linecap="round"/>

  <!-- paper grain -->
  <rect width="400" height="400" filter="url(#grain)"/>
</svg>