<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.35 0 0 0 0 0.3 0 0 0 0 0.5 0 0 0 0.10 0"/>
    </filter>
  </defs>

  <!-- paper background -->
  <rect width="400" height="400" fill="#F7F1E3"/>

  <!-- soft shadow wash -->
  <ellipse cx="200" cy="344" rx="96" ry="13" fill="#E9E5F6"/>

  <!-- the sheet, slightly tilted -->
  <g transform="rotate(-8 200 200)">
    <!-- main sheet with curled corner removed -->
    <path d="M122 80
             H278
             Q290 80 290 92
             V270
             L245 315
             H122
             Q110 315 110 303
             V92
             Q110 80 122 80 Z"
          fill="#F0D76E" stroke="#5A4BC0" stroke-width="7"
          stroke-linejoin="round" stroke-linecap="round"/>

    <!-- folded-back corner (coral underside) -->
    <path d="M290 270 L245 270 L245 315 Z"
          fill="#E8806A" stroke="#5A4BC0" stroke-width="7"
          stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- paper grain -->
  <rect width="400" height="400" filter="url(#grain)"/>
</svg>