<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mực demo</title>
<style>
  :root { --tim: #5B4CC4; --ink: #1F1B3A; --paper: #fff; --rule: #DDD8F0; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --tim: #A99BFF; --ink: #F1EEFF; --paper: #14122A; --rule: #3A3560; } }
  :root[data-theme="light"] { --tim: #5B4CC4; --ink: #1F1B3A; --paper: #fff; --rule: #DDD8F0; color-scheme: light; }
  :root[data-theme="dark"] { --tim: #A99BFF; --ink: #F1EEFF; --paper: #14122A; --rule: #3A3560; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--rule); }
  header h1 { margin: 0; font-size: 18px; }
  main { max-width: 1080px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  .hub { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .tile { display: grid; place-items: center; min-height: 120px; border-radius: 16px; background: var(--tim); color: var(--paper); font-weight: 700; text-decoration: none; }
  .card { border: 1px solid var(--rule); border-radius: 16px; padding: 16px; }
  .card h2 { margin: 0 0 8px; font-size: 16px; }
  .bar { height: 10px; border-radius: 5px; background: var(--rule); } .bar i { display: block; height: 100%; width: 62%; border-radius: 5px; background: var(--tim); }
  .row { display: flex; gap: 8px; } .row input { flex: 1; min-width: 0; height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); font: inherit; }
  button.b { height: 40px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--tim); color: var(--paper); font: inherit; font-weight: 700; }
  .lorem { max-width: 68ch; } .tall { height: 600px; }
  .tools { display: flex; gap: 8px; }
  .tools button { height: 32px; border-radius: 8px; border: 1px solid var(--rule); background: none; color: inherit; }
</style>
</head>
<body>
<header>
  <h1>Demo: Mentor (trang giả)</h1>
  <div class="tools">
    <button id="lang" type="button">vi / en</button>
    <button id="theme" type="button">sáng / tối</button>
  </div>
</header>
<main>
  <section class="hub" data-guide="hub">
    <a class="tile" href="#" data-guide="courses" data-guide-label="Khóa học">Khóa học</a>
    <a class="tile" href="#" data-guide="practice" data-guide-label="Luyện tập">Luyện tập</a>
    <a class="tile" href="#" data-guide="ask" data-guide-label="Hỏi đáp">Hỏi đáp</a>
    <a class="tile" href="#">Tiến độ (chưa có hướng dẫn)</a>
  </section>
  <section class="card" data-guide="progress" data-guide-label="Tiến độ">
    <h2>Tiến độ tuần này</h2>
    <div class="bar"><i></i></div>
    <p class="lorem">Thanh tím cho biết em đã xong bao nhiêu. Đoạn chữ này nằm trong vùng "progress".</p>
  </section>
  <section class="card" data-guide="search" data-guide-label="Tìm khóa">
    <h2>Tìm khóa học</h2>
    <div class="row"><input placeholder="Gõ tên môn" aria-label="Tìm"><button class="b" type="button">Tìm</button></div>
  </section>
  <section class="card"><h2>Vùng không có hướng dẫn</h2><p class="lorem">Thả Mực vào đây để thấy câu "chỗ này mình chưa biết".</p></section>
  <div class="tall" aria-hidden="true"></div>
</main>

<mentor-mascot id="m"></mentor-mascot>

<script type="module">
  import "./mascot.js";
  const m = document.getElementById("m");
  m.guides = {
    hub: { vi: "Bốn ô lớn là các việc chính của app. Chạm vào ô nào thì vào phần đó.", en: "The four big squares are the main things in the app." },
    courses: { vi: "Các khóa em đang học và việc Mentor xếp cho hôm nay.", en: "The courses you're taking and what Mentor planned for today." },
    practice: { vi: "Mentor chọn sẵn câu hỏi từ bài em đang học và những câu em hay sai.", en: "Questions picked from what you're learning and what you often miss." },
    ask: { vi: "Chụp bài tập, gõ hoặc nói câu hỏi. Mentor sẽ gợi ý khóa hợp với em.", en: "Snap an exercise, type or talk. Mentor suggests courses." },
    progress: { vi: "Thanh tím là phần đã xong. Mentor tự xếp lịch nếu em đi chậm.", en: "The purple bar is what's done. Mentor adjusts the plan if you fall behind." },
    search: { vi: "Gõ tên môn hoặc chủ đề để tìm khóa hợp với lớp của em.", en: "Type a subject or topic to find courses for your grade." },
  };
  // stub: a real host calls its gateway here
  m.ask = (q, lang) => new Promise((ok) => setTimeout(() => ok(lang === "en" ? `You asked: "${q}". Tap a tile to get started.` : `Bạn hỏi: "${q}". Chạm vào một ô ở trên để bắt đầu nhé.`), 900));
  m.addEventListener("mascot-ask", (e) => console.log("ask", e.detail));
  m.addEventListener("mascot-guide", (e) => console.log("guide", e.detail));
  document.getElementById("lang").onclick = () => { m.lang = m.lang === "vi" ? "en" : "vi"; };
  document.getElementById("theme").onclick = () => {
    const r = document.documentElement;
    r.dataset.theme = (r.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark" ? "light" : "dark";
    m.setAttribute("theme", r.dataset.theme);
  };
</script>
</body>
</html>
