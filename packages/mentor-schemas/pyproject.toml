[project]
name = "mentor-schemas"
version = "0.1.0"
description = "Shared contracts for the AI mentor: workspace layout, events, sandbox API, outbox, protocols."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mentor_schemas"]
