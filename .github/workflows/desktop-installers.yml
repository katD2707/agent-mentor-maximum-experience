# Installers of the desktop app for Windows and Linux, built on GitHub's machines. macOS is left out for now (its build
# fails); to bring it back, add a macos-latest row to the matrix (--bundles dmg --target universal-apple-darwin).
# Release: push a tag that matches the app version (git tag v0.2.0 && git push origin v0.2.0); the installers are then
# published on the repository's Releases page with the install steps. By hand: Actions > "Desktop installers" >
# Run workflow (artifacts only, no release).
# Server address compiled into the app: the run input, else the repository variable MENTOR_API_BASE, else the shared
# trial server (infra/share: the PC that runs share-up.ps1).
#
# macOS: without Apple secrets the app is ad-hoc signed, so the first open needs System Settings > Privacy & Security >
# "Open Anyway". With these repository secrets set it is signed with a Developer ID and notarized, and opens with no
# warning: APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID,
# APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID.
name: Desktop installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      api_base:
        description: "Server address compiled into the app, e.g. https://mentor.example.vn/api (empty: the default)"
        required: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --bundles nsis
            files: apps/app/src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            name: linux
            args: --bundles deb,appimage
            files: |
              apps/app/src-tauri/target/release/bundle/deb/*.deb
              apps/app/src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    env:
      VITE_API_BASE: ${{ inputs.api_base || vars.MENTOR_API_BASE || 'https://app.mentor-hoc.workers.dev/api' }}
      VITE_API_MOCK: ""
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@9.15.9
      - run: pnpm -C apps/app install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Build
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm -C apps/app tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: Mentor-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  feco:
    # the self-contained package for the F-Eco launcher (bundled gateway, Drive courses), see integrations/feco/README.md
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@9.15.9
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - name: Build the F-Eco package
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File integrations/feco/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Mentor-feco
          path: dist/mentor-*-windows-x64.zip
          if-no-files-found: error

  release:
    # publishes whatever platforms built: one failing build must not hold back the others
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [build, feco]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Install steps
        run: |
          cat > notes.md <<'EOF'
          ## Cài Mentor

          Tải đúng file cho máy của bạn ở mục **Assets** bên dưới, rồi:

          | Máy | File | Cách cài |
          |---|---|---|
          | Windows 10, 11 | `Mentor_..._x64-setup.exe` | Bấm đúp rồi làm theo trình cài. Nếu hiện "Windows protected your PC", bấm **More info**, rồi **Run anyway** (bản thử chưa có chữ ký số). |
          | Ubuntu, Linux Mint, Debian | `Mentor_..._amd64.deb` | Bấm đúp, cửa sổ Software hiện ra, bấm **Install**. |
          | Linux khác | `Mentor_..._amd64.AppImage` | Chuột phải, **Properties**, **Permissions**, bật **Allow executing file as program**, rồi bấm đúp. |
          | F-Eco (quản trị viên) | `mentor-...-windows-x64.zip` | Gói tự chứa cho F-Launcher, không cài trực tiếp. Xem `integrations/feco/README.md`. |

          Mở app và đăng nhập bằng tài khoản người phụ trách gửi cho bạn. App cần Internet.
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          name: Mentor ${{ github.ref_name }}
          body_path: notes.md
          # artifacts keep their bundle subfolders (deb/, appimage/): match at any depth
          files: |
            dist/**/*.exe
            dist/**/*.deb
            dist/**/*.AppImage
            dist/**/*.dmg
            dist/**/mentor-*-windows-x64.zip
