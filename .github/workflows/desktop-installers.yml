# Installers of the desktop app for Windows, macOS and Linux, built on GitHub's machines (macOS can only be built on a Mac).
# Run it by hand: Actions > "Desktop installers" > Run workflow, and give the server address the app should use.
# The installers are attached to the run as artifacts (Mentor-windows, Mentor-macos, Mentor-linux).
#
# macOS: without Apple secrets the app is ad-hoc signed, so the first open needs System Settings > Privacy & Security >
# "Open Anyway". With these repository secrets set it is signed with a Developer ID and notarized, and opens with no
# warning: APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID,
# APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID.
name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Server address compiled into the app, e.g. https://mentor.example.vn/api"
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --bundles nsis
            files: apps/app/src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            name: macos
            args: --bundles dmg --target universal-apple-darwin
            files: apps/app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            name: linux
            args: --bundles deb,appimage
            files: |
              apps/app/src-tauri/target/release/bundle/deb/*.deb
              apps/app/src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    env:
      VITE_API_BASE: ${{ inputs.api_base }}
      VITE_API_MOCK: ""
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@9.15.9
      - run: pnpm -C apps/app install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Build
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm -C apps/app tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: Mentor-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
