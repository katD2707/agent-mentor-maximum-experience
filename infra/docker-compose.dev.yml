# Dev stack: gateway + LiteLLM model router.
#   docker compose -f infra/docker-compose.dev.yml up --build
# Secrets come from the shell or a repo-root .env (not committed): FPT_API_BASE, FPT_API_KEY, MODEL_ROUTER_MASTER_KEY.
# MENTOR_ENV=dev seeds the accounts hocsinh / giaovien (password 123456). The app (apps/app, Vite) runs on the host:
# `pnpm dev` in apps/app, http://localhost:5173 (an allowed CORS origin).
name: mentor-dev

services:
  gateway:
    build:
      context: ..
      dockerfile: infra/gateway.Dockerfile
    # non-root (the image default is 4242:4242). On Linux the data dir must be writable by it:
    # `sudo chown -R 4242:4242 var`, or set MENTOR_UID/MENTOR_GID to your own uid/gid.
    user: "${MENTOR_UID:-4242}:${MENTOR_GID:-4242}"
    ports:
      - "8000:8000"
    environment:
      MENTOR_ENV: dev   # required: an unset MENTOR_ENV means prod (no dev accounts)
      MENTOR_DATA_DIR: /data
      PUBLIC_BASE_URL: http://localhost:8000
      WEB_ORIGIN: http://localhost:5173
    volumes:
      - ${MENTOR_HOST_DATA_DIR:-../var}:/data

  model-router:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      FPT_API_BASE: ${FPT_API_BASE:-}
      FPT_API_KEY: ${FPT_API_KEY:-}
      MODEL_ROUTER_MASTER_KEY: ${MODEL_ROUTER_MASTER_KEY:-sk-dev-master}
    volumes:
      - ../services/model-router/config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
