# Local demo on one Linux machine: the dev experience (seeded accounts hocsinh / giaovien, password 123456) in
# Docker, reachable only from this machine. Start it with `bash infra/demo.sh`.
# Not for real learners: MENTOR_ENV=dev, no HTTPS. Data lives in the `mentor_demo_data` volume.
name: mentor-demo

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  gateway:
    build:
      context: ..
      dockerfile: infra/gateway.Dockerfile
    image: mentor-gateway:demo
    restart: unless-stopped
    environment:
      MENTOR_ENV: dev
      MENTOR_DATA_DIR: /data
      PUBLIC_BASE_URL: http://localhost:${API_PORT:-8000}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - mentor_demo_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging: *logging

  model-router:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:main-stable}
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      FPT_API_BASE: ${FPT_API_BASE:?set FPT_API_BASE in infra/.env.demo}
      FPT_API_KEY: ${FPT_API_KEY:?set FPT_API_KEY in infra/.env.demo}
      MODEL_ROUTER_MASTER_KEY: ${MODEL_ROUTER_MASTER_KEY:?run bash infra/demo.sh (it generates this key)}
    volumes:
      - ../services/model-router/config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
      args:
        VITE_API_BASE: http://localhost:${API_PORT:-8000}/api   # baked in at build time
    image: mentor-web:demo
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on: [gateway]
    logging: *logging

volumes:
  mentor_demo_data:
