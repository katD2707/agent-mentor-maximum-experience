[project]
name = "mentor-gateway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mentor-schemas",
    "mentor-parent-channel",
    "mentor-email-ingest",
    "mentor-scripts",  # practice evidence: mastery is recomputed with bkt_update's own functions (CONTRACTS 10.2)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",  # [standard] brings websockets; without it /api/ws/chat returns 404
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "croniter>=2.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6",
    "tzdata>=2024.1",
    "cryptography>=43",
    "pywebpush>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mentor_gateway"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Header", "fastapi.Body"]
