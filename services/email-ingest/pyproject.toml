[project]
name = "mentor-email-ingest"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiosmtpd>=1.4",
    "mentor-schemas",
    "tzdata>=2024.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mentor_email_ingest"]
