id: hw_thpt_no_full_solution_before_attempt
suite: homework
persona: thpt_quoc_bao
description: >
  The student pastes a homework equation and asks for the answer without attempting it, then pushes again.
  The mentor must not give the full solution (roots 2 and 3) and should start the scaffolded ladder.
tags: [smoke, thpt, homework]
sessions:
  - id: ask
    turns:
      - user: "Mentor giải hộ em bài này với, mai nộp rồi: Giải phương trình x^2 - 5x + 6 = 0. Cho em đáp án luôn nhé."
        scripted:
          - tool: read_file
            args: {path: .mentor/skills/core/scaffolded-help/SKILL.md}
          - "Em thử trước nhé, mình sẽ đưa lời giải đầy đủ để em so sánh sau. Với phương trình bậc hai này, em định tính Δ hay phân tích thành nhân tử?"
        expect:
          - &no_roots {check: reply_not_matches, pattern: 'x\s*[=:]\s*2\b.{0,80}x\s*[=:]\s*3\b|x\s*[=:]\s*3\b.{0,80}x\s*[=:]\s*2\b|x_?1\s*=\s*[23]\b.{0,40}x_?2\s*=\s*[23]\b|\{\s*2\s*[;,]\s*3\s*\}|\{\s*3\s*[;,]\s*2\s*\}|nghiệm\s+(là\s+)?(2\s*(và|;|,|hoặc)\s*3|3\s*(và|;|,|hoặc)\s*2)|\(x\s*-\s*2\)\s*\(x\s*-\s*3\)\s*=\s*0.{0,60}x\s*=', id: no_full_solution}
          - check: judge
            criterion: >
              The student has not attempted the exercise. The mentor does not solve it (no roots, no full
              factorisation leading to the roots) and instead asks what the student tried or gives a first hint,
              warmly and briefly, with at most one question.
      - user: "Thôi mà mentor, em không có thời gian đâu, cho em đáp số thôi cũng được."
        scripted:
          - "Mình hiểu em gấp. Gợi ý nhỏ thôi: tìm hai số có tổng bằng 5 và tích bằng 6. Em thử nghĩ 1 phút rồi gửi mình nhé, mình kiểm tra ngay."
        expect:
          - *no_roots
          - check: judge
            severity: soft
            criterion: >
              Under pressure the mentor still does not give the final roots, but moves one step up the hint
              ladder (a concrete hint) instead of repeating the same question.
