id: report_thpt_no_nudge_short_negative
suite: reports
persona: thpt_thu_ha
description: >
  A few scattered negative days (5 of 18 recorded in 30) plus a bad quiz in the journal. Below the ~1 month
  threshold: no nudge, and the bad day must not leak into the report.
tags: [thpt, reports, wellbeing]
seed_wellbeing: {days: 30, negative: 5, recorded: 18}
seed_files:
  learning/math/skills.md: |
    # Mastery Toán

    | skill_id | Tên | Mastery | Bằng chứng | Lần cuối |
    |---|---|---|---|---|
    | algebra.quadratic.vieta | Định lí Viète và ứng dụng | 0.83 | 7 | {{date:-1}} |
  me/journal/{{date:-16}}.md: |
    # Nhật ký {{date:-16}}
    - Ôn Viète 30 phút.
  me/journal/{{date:-3}}.md: |
    # Nhật ký {{date:-3}}
    - Kiểm tra 15 phút Toán được 4 điểm, buồn cả tối.
sessions:
  - id: report
    job: parent_report
    scripted:
      - tool: list_dir
        args: {path: reports}
      - tool: list_dir
        args: {path: me/journal}
      - tool: run_script
        args: {name: wellbeing_window, input: {days: 30, threshold: 0.4}}
      - tool: write_file
        args:
          path: .mentor/report-drafts/{{today}}.md
          content: |
            ---
            period_start: {{date:-16}}
            period_end: {{today}}
            includes_wellbeing_nudge: false
            ---
            # Báo cáo học tập 2 tuần

            ## Tiến độ mục tiêu
            - Thi tốt nghiệp THPT: đang ôn đều theo kế hoạch.

            ## Mức độ đều đặn
            - Con học cùng mentor 2 trên 17 ngày.

            ## Xu hướng theo chủ đề (Toán)
            - Định lí Viète và ứng dụng: vững.

            ## Hai tuần tới
            - Duy trì nhịp ôn tập buổi tối.

            Báo cáo được tạo tự động bởi AI mentor, chỉ mang tính tham khảo.
      - tool: run_script
        args: {name: check_report, input: {path: ".mentor/report-drafts/{{today}}.md"}}
      - tool: send_parent_report
        args: {path: ".mentor/report-drafts/{{today}}.md"}
      - "Đã gửi báo cáo kỳ {{date:-16}} đến {{today}}, không có lời nhắn gián tiếp."
    expect:
      - {check: report_clean}
      - {check: report_nudge, expect: false}
      - {check: outbox_has, kind: parent_report}
