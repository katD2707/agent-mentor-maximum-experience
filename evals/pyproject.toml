[project]
name = "mentor-evals"
version = "0.1.0"
description = "Scenario evals for the mentor: synthetic personas driven through the harness in-process."
requires-python = ">=3.11"
dependencies = [
    "mentor-schemas",
    "mentor-harness",
    "mentor-scripts",
    "mentor-gateway",  # reuses provisioning.provision_workspace for fresh workspaces
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "anthropic>=2.3",  # LLM judge only (--judge claude); never used on the product path
]

[project.scripts]
mentor-evals = "mentor_evals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mentor_evals"]

[tool.uv.sources]
mentor-gateway = { workspace = true }

[tool.ruff]
extend = "../pyproject.toml"
